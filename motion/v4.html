<!doctype html>
<html><head><meta charset="utf-8">
<title>넾다세일 — 작게 올 리 없다 (v4)</title>
<style>
@font-face{font-family:P;src:url(fonts/Pretendard-Black.otf);font-weight:900}
@font-face{font-family:P;src:url(fonts/Pretendard-ExtraBold.otf);font-weight:800}
@font-face{font-family:P;src:url(fonts/Pretendard-Bold.otf);font-weight:700}
@font-face{font-family:P;src:url(fonts/Pretendard-SemiBold.otf);font-weight:600}
@font-face{font-family:P;src:url(fonts/Pretendard-Medium.otf);font-weight:500}
html,body{margin:0;background:#fff;overflow:hidden}
canvas{display:block}
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
import { burst } from './kvburst.js';
// v4: one idea per cut, centred, complete KV-style shards (never cropped), bigger type living in the same
// white studio as the photographs, colour fields for rhythm. 120BPM → 1 beat = 15 frames @30fps.
const W = 1080, H = 1920, FPS = 30, BEAT = 15;
const C = { white: '#FFFFFF', green: '#00F550', purple: '#9162FF', black: '#000000', studio: '#F3F3F1' };
const CUTS = [
  { id: 'drop',      at: 0,   len: 36 },  // 상자 낙하 (AI 영상 V1 예정, 현재 코드)
  { id: 'arrived',   at: 36,  len: 36 },  // 택배 왔다.
  { id: 'strain',    at: 72,  len: 45 },  // 떨림·빛 (AI 영상 V2 앞부분 예정)
  { id: 'nosmall',   at: 117, len: 45 },  // 작게 올 리 / 없지.
  { id: 'grow',      at: 162, len: 75 },  // 커진다 (AI 영상 V2 뒷부분 예정)
  { id: 'geodae',    at: 237, len: 60 },  // 거 · 대 · 한
  { id: 'open',      at: 297, len: 63 },  // 터진다 (AI 영상 V3 예정)
  { id: 'benefit',   at: 360, len: 60 },  // 혜택이 찾아온다!
  { id: 'from',      at: 420, len: 60 },  // 언제부터? 10.26 월요일
  { id: 'until',     at: 480, len: 60 },  // 언제까지? 11.8 일요일
  { id: 'end',       at: 540, len: 150 }, // 엔딩
];
const FRAMES = CUTS.at(-1).at + CUTS.at(-1).len;
window.COMP = { w: W, h: H, fps: FPS, frames: FRAMES, cuts: CUTS }; window.ready = false;

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (f, a, b) => clamp((f - a) / (b - a));
const outExpo = t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t);
const outBack = (t, s = 1.7) => 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2);
const outQuart = t => 1 - Math.pow(1 - t, 4);
const inOutCubic = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const inQuad = t => t * t, inCubic = t => t * t * t;
const lerp = (a, b, t) => a + (b - a) * t;
const shake = (lf, at, amp, len = 7) => { const t = lf - at; if (t < 0 || t > len) return [0, 0];
  const k = amp * Math.pow(1 - t / len, 2); return [Math.sin(t * 2.9 + at) * k, Math.cos(t * 3.7 + at) * k]; };

// ── backgrounds: type cuts live in the same seamless studio as the photos (soft floor falloff), or in a KV colour
function studio() {
  ctx.fillStyle = C.studio; ctx.fillRect(0, 0, W, H);
  const g = ctx.createRadialGradient(W / 2, 880, 80, W / 2, 980, 1250);
  g.addColorStop(0, '#FFFFFF'); g.addColorStop(0.55, 'rgba(255,255,255,0.75)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
const fill = col => { ctx.fillStyle = col; ctx.fillRect(0, 0, W, H); };

// ── type
function text(str, x, y, { size = 160, weight = 900, color = C.black, track = -0.045 } = {}) {
  ctx.font = `${weight} ${size}px P`; ctx.letterSpacing = `${track * size}px`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = color; ctx.fillText(str, x, y);
}
// rise out of the baseline (mask) and settle from a hair larger
function rise(str, y, t, o = {}) {
  if (t <= 0) return; const k = outExpo(t), size = o.size ?? 160;
  ctx.save(); ctx.beginPath(); ctx.rect(0, y - size * 0.66, W, size * 1.32); ctx.clip();
  ctx.translate(W / 2, y + (1 - k) * size * 0.95); const s = lerp(1.06, 1, k); ctx.scale(s, s);
  text(str, 0, 0, o); ctx.restore();
}
// slam: scales down onto the page with a little overshoot
function slam(str, y, t, o = {}) {
  if (t <= 0) return; const k = outBack(clamp(t), 1.3);
  ctx.save(); ctx.translate(W / 2, y); const s = lerp(1.9, 1, k); ctx.scale(s, s); ctx.globalAlpha = clamp(t * 4);
  text(str, 0, 0, o); ctx.restore();
}
// syllables drop in one by one and land on the floor like parcels, each with its own soft contact shadow
function landing(str, y, lf, { size = 180, gap = 6, ...o } = {}) {
  const chars = [...str]; ctx.font = `${o.weight ?? 900} ${size}px P`; ctx.letterSpacing = '0px';
  const widths = chars.map(c => ctx.measureText(c).width * (1 + (o.track ?? -0.045)));
  const total = widths.reduce((a, b) => a + b, 0); let x = W / 2 - total / 2;
  chars.forEach((ch, i) => {
    const t0 = i * 3, fall = prog(lf, t0, t0 + 6), land = lf - (t0 + 6);
    const cx = x + widths[i] / 2; x += widths[i];
    if (fall <= 0) return;
    const yy = lf < t0 + 6 ? lerp(y - 700, y, inQuad(fall)) : y;
    const sq = land >= 0 ? Math.exp(-land / 2.5) * Math.cos(land * 1.4) * 0.12 : 0;
    if (ch.trim()) { // contact shadow
      const near = lf < t0 + 6 ? fall : 1; ctx.save(); ctx.globalAlpha = 0.18 * near; ctx.filter = 'blur(10px)';
      ctx.fillStyle = '#000'; ctx.beginPath(); ctx.ellipse(cx, y + size * 0.47, widths[i] * 0.42 * (0.6 + 0.4 * near), size * 0.05, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore(); }
    ctx.save(); ctx.translate(cx, yy + size * 0.42); ctx.scale(1 + sq, 1 - sq); ctx.translate(0, -size * 0.42);
    text(ch, 0, 0, { size, track: 0, ...o }); ctx.restore();
  });
}

// ── media
const IMG = {};
function cover(img, { s = 1, dx = 0, dy = 0, ax = 0.5, ay = 0.5 } = {}) {
  if (!img) return; const k = Math.max(W / img.width, H / img.height) * s, w = img.width * k, h = img.height * k;
  ctx.drawImage(img, (W - w) * ax + dx, (H - h) * ay + dy, w, h);
}

// ── logo
let LOGO = null;
function logoAt(x, y, width, color = C.black) {
  const s = width / LOGO.w; ctx.save(); ctx.translate(x - width / 2, y - LOGO.h * s / 2); ctx.scale(s, s);
  ctx.fillStyle = color; LOGO.pieces.forEach(p => ctx.fill(p.path, 'evenodd')); ctx.restore(); return LOGO.h * s;
}

// burst layouts (angles in degrees, 0 = right, 90 = down). Kept inside the frame for each use.
const L_WIDE = [ // around a wide word block: top, bottom and diagonals only
  { a: -94, L: 520, w: 90, c: 'green' }, { a: -58, L: 380, w: 76, c: 'purple' }, { a: -128, L: 400, w: 78, c: 'purple' },
  { a: -24, L: 220, w: 56, c: 'black' }, { a: 86, L: 520, w: 90, c: 'purple' }, { a: 52, L: 400, w: 80, c: 'green' },
  { a: 124, L: 380, w: 76, c: 'green' }, { a: 160, L: 200, w: 52, c: 'black' },
];
const tint = (lay, map) => lay.map(b => ({ ...b, c: map[b.c] ?? b.c }));

const R = {
  drop(lf) {
    fill(C.white);
    const land = 7, fall = prog(lf, 0, land), y = lf < land ? lerp(-820, 0, inQuad(fall)) : 0;
    const bounce = lf >= land ? Math.exp(-(lf - land) / 3) * Math.sin((lf - land) * 0.9) * -10 : 0;
    const [sx, sy] = shake(lf, land, 16);
    ctx.save(); ctx.translate(sx, sy);
    ctx.globalAlpha = lf >= land ? 1 : 0; cover(IMG.heroPlate); ctx.globalAlpha = 1;
    const push = 1 + 0.02 * outQuart(prog(lf, land, 36));
    ctx.translate(W / 2, H / 2); ctx.scale(push, push); ctx.translate(-W / 2, -H / 2);
    cover(IMG.heroCut, { dy: y + bounce }); ctx.restore();
  },
  arrived(lf) { studio(); landing('택배 왔다.', 930, lf, { size: 190 }); },
  strain(lf) {
    const k = inOutCubic(prog(lf, 0, 45)), tr = 1.5 + 5 * k;
    cover(IMG.strain, { s: lerp(1.0, 1.1, k), dx: Math.sin(lf * 2.3) * tr, dy: Math.cos(lf * 3.1) * tr });
  },
  nosmall(lf) {
    fill(C.black);
    rise('작게 올 리', 850, prog(lf, 0, 10), { size: 170, color: C.white });
    const [sx, sy] = shake(lf, 14, 14);
    ctx.save(); ctx.translate(sx, sy); slam('없지.', 1060, prog(lf, 12, 20), { size: 230, color: C.green }); ctx.restore();
  },
  grow(lf) { // placeholder until AI video V2: push from the small box into the giant face
    const k = prog(lf, 0, 40);
    if (k < 1) { fill(C.white); cover(IMG.hero, { s: lerp(1, 3.2, inCubic(k)) }); }
    else { const k2 = outQuart(prog(lf, 40, 75)); cover(IMG.giantface, { s: lerp(1.12, 1.0, k2) }); }
  },
  geodae(lf) {
    const b = Math.floor(lf / BEAT), bt = lf - b * BEAT;
    const bgs = [C.white, C.green, C.purple, C.white];
    fill(bgs[b]); if (b === 3) studio();
    const [sx, sy] = shake(bt, 0, b < 3 ? 18 : 24);
    ctx.save(); ctx.translate(sx, sy);
    if (b < 3) { const pk = outExpo(prog(bt, 0, 5)); ctx.save(); ctx.translate(W / 2, 960); const s = lerp(1.3, 1, pk); ctx.scale(s, s);
      text('거대한'[b], 0, 20, { size: 720, track: 0 }); ctx.restore(); }
    else { burst(ctx, { cx: W / 2, cy: 960, clear: [440, 150], margin: 40, t: prog(bt, 0, 10), seed: 9, layout: L_WIDE, spin: bt * 0.15 });
      slam('거대한', 960, prog(bt, 0, 6), { size: 300, track: -0.05 }); }
    ctx.restore();
  },
  open(lf) { // placeholder until AI video V3: the stressed face trembles, then bursts to white
    const k = prog(lf, 0, 40), tr = 2 + 10 * k;
    cover(IMG.giantface, { s: lerp(1.0, 1.08, k), dx: Math.sin(lf * 2.7) * tr, dy: Math.cos(lf * 3.3) * tr });
    if (lf >= 40) { fill(`rgba(0,245,80,${prog(lf, 40, 46)})`); fill(`rgba(255,255,255,${prog(lf, 46, 56)})`); }
  },
  benefit(lf) {
    studio();
    const [sx, sy] = shake(lf, 2, 22); ctx.save(); ctx.translate(sx, sy);
    burst(ctx, { cx: W / 2, cy: 970, clear: [420, 230], margin: 40, t: prog(lf, 0, 12), seed: 4, layout: L_WIDE, spin: lf * 0.08 });
    slam('혜택이', 870, prog(lf, 2, 9), { size: 180 });
    slam('찾아온다!', 1070, prog(lf, 5, 12), { size: 180 });
    ctx.restore();
  },
  from(lf) { dateCut(lf, C.green, '언제부터?', '10.26', '월요일', { green: 'purple', purple: 'black' }, 21); },
  until(lf) { dateCut(lf, C.purple, '언제까지?', '11.8', '일요일', { purple: 'green', green: 'black' }, 33); },
  end(lf) {
    fill(C.white); studio();
    const hit = 6, [sx, sy] = shake(lf, hit, 20, 8);
    const punch = 1 + 0.05 * (1 - outQuart(prog(lf, hit, hit + 14))) * (lf >= hit ? 1 : 0), drift = 1 + 0.03 * prog(lf, hit, 150);
    ctx.save(); ctx.translate(W / 2 + sx, 900 + sy); ctx.scale(punch * drift, punch * drift); ctx.translate(-W / 2, -900);
    burst(ctx, { cx: W / 2, cy: 1090, clear: [470, 400], margin: 34, t: prog(lf, hit - 1, hit + 12), seed: 17, spin: lf * 0.05, layout: [
      { a: -92, L: 460, w: 86, c: 'green' }, { a: -56, L: 360, w: 72, c: 'purple' }, { a: -126, L: 360, w: 72, c: 'purple' },
      { a: -20, L: 150, w: 44, c: 'black' }, { a: -160, L: 150, w: 44, c: 'green' },
      { a: 88, L: 300, w: 70, c: 'purple' }, { a: 58, L: 260, w: 64, c: 'green' }, { a: 122, L: 260, w: 64, c: 'green' },
    ] });
    // logo slams in from the camera
    const lt = prog(lf, 0, hit), ls = lf < hit ? lerp(3.2, 1, outQuart(lt)) : 1 - 0.035 * Math.sin(prog(lf, hit, hit + 8) * Math.PI);
    ctx.save(); ctx.translate(W / 2, 880); ctx.scale(ls, ls); ctx.globalAlpha = clamp(lt * 3); const lh = logoAt(0, 0, 860); ctx.restore();
    ctx.restore();
    rise('거대한 혜택이 찾아온다!', 1250, prog(lf, 16, 26), { size: 62, weight: 800, track: -0.03 });
    rise('10.26.~ 11.8.', 1335, prog(lf, 20, 30), { size: 54, weight: 600, track: -0.01 });
    rise('네이버플러스 스토어', 1440, prog(lf, 26, 36), { size: 40, weight: 700, track: 0, color: '#222' });
  },
};
// question → answer → weekday, all inside one colour field, with a burst behind the answer
function dateCut(lf, bgc, q, ans, day, map, seed) {
  fill(bgc);
  rise(q, 680, prog(lf, 0, 8), { size: 76, weight: 800, track: -0.03 });
  const hit = 12, [sx, sy] = shake(lf, hit, 20);
  ctx.save(); ctx.translate(sx, sy);
  burst(ctx, { cx: W / 2, cy: 950, clear: [430, 370], margin: 36, t: prog(lf, hit - 1, hit + 12), seed, spin: lf * 0.1,
    layout: tint([{ a: -118, L: 420, w: 80, c: 'green' }, { a: -90, L: 480, w: 86, c: 'purple' }, { a: -62, L: 420, w: 80, c: 'black' },
                  { a: 62, L: 420, w: 80, c: 'purple' }, { a: 90, L: 480, w: 86, c: 'green' }, { a: 118, L: 420, w: 80, c: 'black' }], map) });
  slam(ans, 990, prog(lf, hit, hit + 7), { size: 340, track: -0.05 });
  ctx.restore();
  // weekday tag
  const t = prog(lf, hit + 8, hit + 16);
  if (t > 0) { const k = outBack(t, 1.6); ctx.save(); ctx.translate(W / 2, 1230); ctx.scale(k, k);
    ctx.fillStyle = C.black; ctx.beginPath(); ctx.roundRect(-118, -46, 236, 92, 46); ctx.fill();
    text(day, 0, 3, { size: 50, weight: 800, color: bgc, track: -0.02 }); ctx.restore(); }
}

function render(f) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.filter = 'none'; ctx.globalAlpha = 1; ctx.clearRect(0, 0, W, H);
  const cut = CUTS.findLast(c => f >= c.at); R[cut.id](f - cut.at, f);
}
window.renderFrame = render;

const load = src => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = src; });
function keyHero(img) { // separate the box from its white plate for the drop
  const c = document.createElement('canvas'); c.width = img.width; c.height = img.height; const x = c.getContext('2d');
  x.drawImage(img, 0, 0); const d = x.getImageData(0, 0, c.width, c.height), a = d.data;
  const plate = document.createElement('canvas'); plate.width = c.width; plate.height = c.height; const px = plate.getContext('2d');
  const pd = px.createImageData(c.width, c.height), p = pd.data;
  for (let i = 0; i < a.length; i += 4) {
    const mn = Math.min(a[i], a[i + 1], a[i + 2]), al = clamp((232 - mn) / 26);
    p[i] = a[i]; p[i + 1] = a[i + 1]; p[i + 2] = a[i + 2]; p[i + 3] = 255;
    if (al > 0.98) p[i] = p[i + 1] = p[i + 2] = 252;
    a[i + 3] = Math.round(al * 255);
  }
  x.putImageData(d, 0, 0); px.putImageData(pd, 0, 0); return [c, plate];
}
const [lg, hero, strain, giantface] = await Promise.all([
  fetch('logo_pieces.json').then(r => r.json()),
  load('../assets/gen/img02_box_hero_v1_1080.jpg'), load('../assets/gen/img03_box_strain_v1_1080.jpg'), load('../assets/gen/img05_box_giantface_v1_1080.jpg'),
  ...[900, 800, 700, 600, 500].map(w => document.fonts.load(`${w} 40px P`)),
]);
lg.pieces.forEach(p => p.path = new Path2D(p.d)); LOGO = lg;
IMG.hero = hero; [IMG.heroCut, IMG.heroPlate] = keyHero(hero); IMG.strain = strain; IMG.giantface = giantface;
render(0); window.ready = true;
</script>
</body></html>
