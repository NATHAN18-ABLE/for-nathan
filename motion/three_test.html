<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#fff}canvas{display:block}</style></head><body>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const W=1080,H=1920; window.COMP={w:W,h:H,fps:30,frames:30};
const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true}); r.setSize(W,H); r.setPixelRatio(1);
r.shadowMap.enabled=true; r.shadowMap.type=THREE.VSMShadowMap; r.toneMapping=THREE.ACESFilmicToneMapping; document.body.appendChild(r.domElement);
const s=new THREE.Scene(); s.background=new THREE.Color('#f4f4f2');
s.environment=new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(),0.04).texture;
const cam=new THREE.PerspectiveCamera(30,W/H,0.1,100); cam.position.set(0,2.2,9); cam.lookAt(0,0.6,0);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(60,60),new THREE.ShadowMaterial({opacity:0.18})); floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; s.add(floor);
const box=new THREE.Mesh(new THREE.BoxGeometry(1.4,1,1.1),new THREE.MeshStandardMaterial({color:'#c8a27a',roughness:0.85})); box.castShadow=true; s.add(box);
const L=new THREE.DirectionalLight('#fff',2.2); L.position.set(3,6,4); L.castShadow=true; L.shadow.mapSize.set(2048,2048); L.shadow.radius=8; L.shadow.blurSamples=16; s.add(L);
window.renderFrame=f=>{const t=f/30; box.position.y=0.5+Math.max(0,3*(1-t*2.2))**2*0.3; box.rotation.y=0.6; r.render(s,cam);};
window.ready=true; window.renderFrame(0);
</script></body></html>
