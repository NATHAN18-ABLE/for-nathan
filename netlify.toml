# Netlify 배포 설정: site 폴더를 그대로 공개합니다 (빌드 과정 없음)
[build]
  publish = "site"

# 이미지·영상·폰트는 오래 저장해 두고 다시 받지 않게
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
