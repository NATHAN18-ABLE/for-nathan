# Netlify: the site is built as plain static files (out/) and served from the root.
# The 3D rooms talk to Supabase Realtime straight from the browser; no server functions.
[build]
  # The build stamp also goes into out/version.txt, so pages left open can tell a newer one is live.
  command = "export NEXT_PUBLIC_BUILD=$(TZ=Asia/Seoul date +%Y.%m.%d-%H%M) && npm run build:static && echo $NEXT_PUBLIC_BUILD > out/version.txt"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  STATIC_EXPORT = "1"
  NEXT_TELEMETRY_DISABLED = "1"

# Unknown paths get the site's own 404 page.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
