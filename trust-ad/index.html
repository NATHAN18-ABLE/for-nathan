<title>확인필 광고 신뢰 시연</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#eef1f4">
<meta name="description" content="AI 광고를 기업이 먼저 검증하고 소비자가 한 번의 탭으로 근거를 확인하는 13단계 흐름 시연 화면">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* Layout: 왼쪽 단계 바 + 가운데 설명 + 오른쪽 실제 화면(휴대폰 또는 기업 콘솔). 1920x1080 캡처 한 장 = 슬라이드 한 장.
   표준 핀테크 앱 문법. 밝은 단일 테마(발표장 투사·캡처용)로 고정. */
:root {
  --canvas: #eef1f4;
  --surface: #ffffff;
  --fill: #f2f4f6;
  --fill-2: #e8ebee;
  --line: #e5e8eb;
  --ink: #191f28;
  --ink-2: #4e5968;
  --ink-3: #6b7684;
  --ink-4: #8b95a1;
  --accent: #1f6fe5;
  --accent-press: #1857c4;
  --accent-soft: #e8f3ff;
  --accent-ink: #1957c2;
  --scrim: rgba(0, 12, 30, 0.48);
  --brand-ondo: #2b3542;
  --brand-gyeol: #3d6b5a;
  --brand-mir: #8a6a52;
  --shadow-device: 0 30px 60px -20px rgba(25, 31, 40, 0.28), 0 12px 24px -12px rgba(25, 31, 40, 0.16);
  --shadow-sheet: 0 -8px 24px rgba(25, 31, 40, 0.08);
  --font: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
  --r-card: 16px;
  --r-ctl: 12px;
  color-scheme: light;
}

html { -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; height: 100%; }
body {
  margin: 0; height: 100%;
  background: var(--canvas); color: var(--ink);
  font-family: var(--font); font-size: 16px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  font-variant-numeric: tabular-nums;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px;
  box-sizing: border-box;
  overflow: hidden;
}
*, *::before, *::after { box-sizing: border-box; }
::selection { background: var(--accent-soft); color: var(--accent-ink); }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.ic { width: 1em; height: 1em; fill: currentColor; flex: none; display: inline-block; vertical-align: -0.125em; }
h1, h2, h3, p { margin: 0; }

/* ---------- Shell ---------- */
.shell { height: 100%; display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 16px; }

.rail {
  background: var(--surface); border-radius: 24px;
  padding: 28px 18px 20px; display: flex; flex-direction: column; min-height: 0;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 0 10px 22px; }
.brand-mark { width: 36px; height: 36px; border-radius: 11px; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 22px; }
.brand b { font-size: 21px; font-weight: 800; letter-spacing: -0.02em; }
.brand span { display: block; font-size: 12.5px; color: var(--ink-3); font-weight: 500; line-height: 1.3; }
.rail-list { flex: 1; overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; gap: 14px; scrollbar-width: none; }
.rail-group h2 { font-size: 13px; font-weight: 700; color: var(--ink-3); padding: 0 10px 6px; letter-spacing: 0.01em; }
.rail-group ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.rail-item {
  width: 100%; display: flex; align-items: center; gap: 12px; text-align: left;
  padding: 8px 10px; border-radius: 12px; font-size: 15.5px; font-weight: 500; color: var(--ink-2);
  transition: background-color 160ms ease, color 160ms ease, transform 120ms var(--ease-out);
}
.rail-item .n {
  width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; flex: none;
  font-size: 13px; font-weight: 700; background: var(--fill); color: var(--ink-3);
  transition: background-color 160ms ease, color 160ms ease;
}
.rail-item.done .n { background: var(--fill-2); color: var(--ink-2); }
.rail-item[aria-current="step"] { background: var(--accent-soft); color: var(--accent-ink); font-weight: 700; }
.rail-item[aria-current="step"] .n { background: var(--accent); color: #fff; }
.rail-item:active { transform: scale(0.98); }
@media (hover: hover) and (pointer: fine) { .rail-item:not([aria-current="step"]):hover { background: var(--fill); } }
.rail-foot { padding: 14px 10px 0; font-size: 12.5px; color: var(--ink-3); line-height: 1.5; border-top: 1px solid var(--line); margin-top: 12px; }

/* ---------- Main ---------- */
.main { position: relative; min-width: 0; min-height: 0; display: grid; grid-template-columns: minmax(320px, 520px) minmax(0, 620px); justify-content: center; column-gap: 72px; padding: 32px 40px 28px 48px; }
.main.is-console { grid-template-columns: minmax(300px, 380px) minmax(0, 1fr); justify-content: stretch; column-gap: 36px; }
.copy { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.copy-body { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 22px; padding-bottom: 24px; }
.who { display: inline-flex; align-items: center; gap: 8px; align-self: flex-start; padding: 7px 14px 7px 12px; border-radius: 999px; background: var(--surface); font-size: 15px; font-weight: 700; color: var(--ink-2); }
.who .ic { font-size: 18px; color: var(--accent); }
.step-no { font-size: 76px; line-height: 1; font-weight: 800; letter-spacing: -0.03em; color: var(--accent); }
.step-no small { font-size: 28px; color: var(--ink-4); font-weight: 700; margin-left: 6px; letter-spacing: 0; }
.step-title { font-size: 40px; line-height: 1.3; font-weight: 800; letter-spacing: -0.03em; text-wrap: balance; word-break: keep-all; }
.step-desc { font-size: 20px; line-height: 1.65; color: var(--ink-2); max-width: 30em; word-break: keep-all; text-wrap: pretty; }
.point { display: flex; gap: 10px; align-items: flex-start; font-size: 17px; line-height: 1.55; color: var(--ink); background: var(--surface); padding: 14px 16px; border-radius: var(--r-card); word-break: keep-all; }
.point .ic { font-size: 20px; color: var(--accent); margin-top: 2px; }

.reaction { display: flex; align-items: center; gap: 14px; }
.reaction .ph { width: 64px; height: 64px; border-radius: 50%; flex: none; }
.bubble { position: relative; background: var(--ink); color: #fff; font-size: 22px; font-weight: 700; padding: 14px 20px; border-radius: 20px; letter-spacing: -0.02em; }
.bubble::before { content: ""; position: absolute; left: -6px; top: 50%; width: 14px; height: 14px; background: inherit; transform: translateY(-50%) rotate(45deg); border-radius: 3px; }

.nav { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.btn { height: 52px; padding: 0 22px; border-radius: 14px; font-size: 17px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; transition: transform 120ms var(--ease-out), background-color 160ms ease; }
.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--accent); color: #fff; }
.btn-ghost { background: var(--surface); color: var(--ink); }
@media (hover: hover) and (pointer: fine) { .btn-primary:hover { background: var(--accent-press); } .btn-ghost:hover { background: var(--fill-2); } }
.btn:disabled { opacity: 0.4; pointer-events: none; }
.btn .ic { font-size: 18px; }
.kbd { font-size: 13.5px; color: var(--ink-3); margin-left: auto; }
.kbd kbd { font: inherit; font-weight: 700; background: var(--surface); border-radius: 6px; padding: 2px 7px; color: var(--ink-2); }

.stage { position: relative; min-width: 0; min-height: 0; display: grid; place-items: center; }
.device-box { position: relative; }
.device { position: absolute; left: 0; top: 0; transform-origin: 0 0; }

/* ---------- Clean (capture-only) mode ---------- */
body.clean .rail, body.clean .nav { display: none; }
body.clean .shell { grid-template-columns: minmax(0, 1fr); }
body.clean .main { padding-inline: 96px; }
.clean-note { display: none; font-size: 14px; color: var(--ink-3); }
body.clean .clean-note { display: block; }
.clean-exit { position: fixed; right: max(20px, env(safe-area-inset-right, 0px)); bottom: 20px; display: none; }
body.clean .clean-exit { display: inline-flex; opacity: 0; transition: opacity 200ms ease; }
body.clean .clean-exit:focus-visible { opacity: 1; }
@media (hover: hover) and (pointer: fine) { body.clean .clean-exit:hover { opacity: 1; } }

/* ---------- Swap transition ---------- */
.swap { transition: opacity 240ms var(--ease-out), transform 240ms var(--ease-out), filter 240ms var(--ease-out); }
.swap.out { opacity: 0; transform: translateY(6px); filter: blur(2px); transition-duration: 120ms; }

/* ---------- Image placeholders ---------- */
.ph { position: relative; display: block; overflow: hidden; background: repeating-linear-gradient(135deg, #eceff2 0 12px, #e4e8ec 12px 24px); }
.ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 200ms ease; }
.ph img.loaded { opacity: 1; }
.ph-label { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--ink-3); text-align: center; padding: 8px; }
.ph-label .ic { font-size: 26px; margin-bottom: 4px; }
.ph-label b { font-size: 13px; font-weight: 700; color: var(--ink-2); }
.ph-label small { font-size: 12px; }
.ph.sm .ph-label b, .ph.sm .ph-label small { display: none; }
.ph.sm .ph-label .ic { font-size: 20px; margin: 0; }

/* ======================================================================
   PHONE
   ====================================================================== */
.phone { width: 414px; height: 868px; border-radius: 62px; background: #101318; padding: 12px; box-shadow: var(--shadow-device); }
.screen { position: relative; width: 390px; height: 844px; border-radius: 50px; overflow: hidden; background: var(--surface); font-size: 15px; line-height: 1.45; color: var(--ink); }
.island { position: absolute; top: 11px; left: 50%; width: 120px; height: 34px; margin-left: -60px; border-radius: 20px; background: #101318; z-index: 30; }
.statusbar { position: absolute; top: 0; left: 0; right: 0; height: 54px; display: flex; align-items: center; justify-content: space-between; padding: 6px 34px 0 40px; font-size: 16px; font-weight: 700; z-index: 25; }
.statusbar .sb-r { display: flex; gap: 6px; align-items: center; }
.sb-bars { display: flex; gap: 2px; align-items: flex-end; height: 12px; }
.sb-bars i { width: 3px; background: currentColor; border-radius: 1px; }
.sb-batt { width: 25px; height: 12px; border: 1.5px solid currentColor; border-radius: 4px; padding: 1.5px; opacity: 0.9; }
.sb-batt i { display: block; height: 100%; width: 78%; background: currentColor; border-radius: 1.5px; }
.home-ind { position: absolute; bottom: 8px; left: 50%; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: var(--ink); z-index: 40; }
.view { position: absolute; inset: 54px 0 0 0; overflow: hidden; }

/* app bar */
.appbar { height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; }
.appbar .logo { font-size: 23px; font-weight: 800; letter-spacing: -0.03em; }
.appbar .acts { display: flex; gap: 18px; font-size: 25px; }
.navbar { height: 52px; display: flex; align-items: center; gap: 8px; padding: 0 12px; font-size: 18px; font-weight: 700; }
.navbar .back { font-size: 24px; width: 36px; height: 36px; display: grid; place-items: center; }
.navbar .t { flex: 1; text-align: center; margin-right: 36px; }

.tabbar { position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: var(--surface); border-top: 1px solid var(--line); display: flex; justify-content: space-around; padding-top: 12px; font-size: 26px; color: var(--ink-3); z-index: 5; }
.tabbar .on { color: var(--ink); }

/* feed */
.feed-clip { position: absolute; left: 0; right: 0; top: 52px; bottom: 84px; overflow: hidden; }
.feed-scroll { transition: transform 420ms var(--ease-out); }
.post-h { height: 58px; display: flex; align-items: center; gap: 10px; padding: 0 14px; }
.avatar { width: 36px; height: 36px; border-radius: 50%; flex: none; }
.mono { display: grid; place-items: center; font-weight: 800; color: #fff; font-size: 15px; }
.post-h .who-t { flex: 1; line-height: 1.3; }
.post-h .who-t b { font-size: 14.5px; font-weight: 700; display: block; }
.post-h .who-t span { font-size: 12.5px; color: var(--ink-3); }
.post-h .dots { font-size: 22px; color: var(--ink-2); }
.tag-ai { display: inline-flex; align-items: center; gap: 3px; font-size: 11.5px; font-weight: 700; color: var(--accent-ink); background: var(--accent-soft); padding: 1px 7px; border-radius: 6px; margin-left: 4px; vertical-align: 1px; }
.post-img { width: 390px; height: 390px; }
.post-img.short { height: 300px; }
.post-actions { display: flex; gap: 16px; padding: 10px 14px 4px; font-size: 25px; }
.post-actions .sp { flex: 1; }
.caption { padding: 2px 14px 14px; font-size: 14px; color: var(--ink); }
.caption b { font-weight: 700; margin-right: 6px; }

.ad-wrap { position: relative; }
.ad-copy { position: absolute; left: 22px; top: 24px; right: 120px; z-index: 2; }
.ad-copy .h { font-size: 38px; line-height: 1.15; font-weight: 800; letter-spacing: -0.04em; display: inline-block; padding: 2px 6px; margin-left: -6px; border-radius: 10px; transition: box-shadow 300ms var(--ease-out), background-color 300ms ease; }
.ad-copy .s { font-size: 15px; font-weight: 600; color: var(--ink-2); margin-top: 6px; }
.ad-badge { position: absolute; right: 14px; top: 14px; z-index: 2; font-size: 11px; font-weight: 800; letter-spacing: 0.06em; color: var(--ink-2); background: rgba(255,255,255,0.85); padding: 3px 7px; border-radius: 6px; }
.ad-copy .h.flag { box-shadow: 0 0 0 2.5px var(--accent); background: rgba(232, 243, 255, 0.85); }
.flag-q { position: absolute; z-index: 3; right: 108px; top: 6px; width: 34px; height: 34px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 22px; box-shadow: 0 6px 14px -4px rgba(31,111,229,0.55); }

.cta-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; font-size: 14.5px; font-weight: 700; background: var(--fill); }
.trust-row { display: flex; align-items: center; gap: 8px; padding: 10px 14px 4px; position: relative; }
[data-go] { cursor: pointer; }
.trust-btn { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px 0 10px; border-radius: 10px; background: var(--accent-soft); color: var(--accent-ink); font-size: 14px; font-weight: 700; position: relative; }
.trust-btn .ic { font-size: 18px; }
.trust-btn.hot { background: var(--accent); color: #fff; }
.tap { position: absolute; width: 46px; height: 46px; border-radius: 50%; background: rgba(25,31,40,0.22); border: 2px solid rgba(255,255,255,0.9); left: 112px; top: 6px; pointer-events: none; }
.ring { position: absolute; inset: -6px; border-radius: 14px; border: 2px solid var(--accent); opacity: 0; pointer-events: none; }
.score-chip { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px 0 8px; border-radius: 10px; background: var(--accent); color: #fff; font-size: 14px; font-weight: 700; }
.score-chip .ic { font-size: 19px; }
.score-chip b { font-size: 17px; font-weight: 800; }
.badge { display: inline-flex; align-items: center; gap: 4px; height: 30px; padding: 0 10px 0 7px; border-radius: 9px; background: var(--accent-soft); color: var(--accent-ink); font-size: 13px; font-weight: 700; }
.badge .ic { font-size: 16px; }

/* sheet */
.dim { position: absolute; inset: 0; background: var(--scrim); z-index: 20; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 22; background: var(--surface); border-radius: 24px 24px 0 0; padding: 10px 22px 34px; box-shadow: var(--shadow-sheet); }
.grabber { width: 40px; height: 5px; border-radius: 3px; background: var(--fill-2); margin: 0 auto 14px; }
.sheet-h { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.sheet-h h3 { font-size: 21px; font-weight: 800; letter-spacing: -0.02em; }
.sheet-h .x { font-size: 24px; color: var(--ink-3); }
.notice { display: flex; gap: 12px; align-items: flex-start; background: var(--accent-soft); border-radius: 14px; padding: 14px; color: var(--ink); }
.notice .ic { font-size: 24px; color: var(--accent); }
.notice b { display: block; font-size: 16px; font-weight: 800; color: var(--accent-ink); }
.notice span { font-size: 14px; color: var(--ink-2); }
.sec-t { font-size: 14px; font-weight: 700; color: var(--ink-3); margin: 22px 0 8px; }
.rows { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; gap: 12px; padding: 11px 0; }
.row + .row { border-top: 1px solid var(--line); }
.row .ri { width: 40px; height: 40px; border-radius: 12px; background: var(--fill); display: grid; place-items: center; font-size: 22px; color: var(--ink-2); flex: none; }
.row .rt { flex: 1; min-width: 0; line-height: 1.35; }
.row .rt b { font-size: 15.5px; font-weight: 700; display: block; }
.row .rt span { font-size: 13.5px; color: var(--ink-3); }
.row .rv { font-size: 14px; font-weight: 700; color: var(--ink-2); }
.cta { display: flex; align-items: center; justify-content: center; gap: 6px; height: 56px; border-radius: 16px; background: var(--accent); color: #fff; font-size: 17px; font-weight: 700; width: 100%; margin-top: 18px; }
.cta.ghost { background: var(--fill); color: var(--ink); }

/* claims (step 5) */
.page { padding: 4px 20px 0; }
.prod-h { display: flex; gap: 14px; align-items: center; padding: 6px 0 18px; }
.prod-h .ph { width: 64px; height: 64px; border-radius: 16px; flex: none; }
.prod-h b { font-size: 17px; font-weight: 800; display: block; letter-spacing: -0.02em; }
.prod-h span { font-size: 13.5px; color: var(--ink-3); }
.summary { font-size: 25px; font-weight: 800; line-height: 1.35; letter-spacing: -0.03em; margin: 4px 0 18px; }
.summary em { font-style: normal; color: var(--accent); }
.claim { display: flex; gap: 12px; align-items: center; padding: 15px; border-radius: 16px; background: var(--fill); }
.claim + .claim { margin-top: 8px; }
.claim .ci { font-size: 28px; flex: none; }
.claim .ci.ok { color: var(--accent); }
.claim .ci.no { color: var(--ink-4); }
.claim .ct { flex: 1; min-width: 0; line-height: 1.35; }
.claim .ct b { font-size: 16px; font-weight: 700; display: block; }
.claim .ct span { font-size: 13px; color: var(--ink-3); }
.st { font-size: 12.5px; font-weight: 700; padding: 4px 9px; border-radius: 8px; flex: none; }
.st.ok { background: var(--accent-soft); color: var(--accent-ink); }
.st.no { background: var(--surface); color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line); }
.claim.unk { background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--fill-2); }
.fine { font-size: 12.5px; color: var(--ink-3); margin-top: 14px; display: flex; gap: 6px; align-items: flex-start; }
.fine .ic { font-size: 15px; margin-top: 2px; }
.bottom-cta { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 20px 34px; background: linear-gradient(to bottom, rgba(255,255,255,0), var(--surface) 22%); }
.bottom-cta .cta { margin-top: 0; }

/* score sheet (step 10) */
.score-h { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; }
.score-big { white-space: nowrap; font-size: 48px; font-weight: 800; letter-spacing: -0.04em; line-height: 1; color: var(--accent); }
.score-big small { font-size: 20px; color: var(--ink-3); font-weight: 700; margin-left: 2px; letter-spacing: 0; }
.score-h p { font-size: 13.5px; color: var(--ink-2); line-height: 1.45; }
.tabs { display: flex; background: var(--fill); border-radius: 12px; padding: 4px; gap: 4px; }
.tabs button { flex: 1; height: 38px; border-radius: 9px; font-size: 14.5px; font-weight: 700; color: var(--ink-3); transition: background-color 160ms ease, color 160ms ease; }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(25,31,40,0.08); }
.tabpanel { min-height: 300px; padding-top: 6px; }
.tl { list-style: none; margin: 8px 0 0; padding: 0; }
.tl li { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: start; padding: 9px 0; position: relative; }
.tl li .dotc { width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 13px; position: relative; z-index: 1; }
.tl li:not(:last-child)::before { content: ""; position: absolute; left: 10px; top: 32px; bottom: -10px; width: 2px; background: var(--accent-soft); }
.tl li b { font-size: 15px; font-weight: 700; display: block; line-height: 1.35; }
.tl li span { font-size: 13px; color: var(--ink-3); }
.tl li time { font-size: 13px; color: var(--ink-3); font-weight: 500; }

/* ranking (step 11) */
.chips { display: flex; gap: 8px; margin: 2px 0 16px; }
.chip { height: 34px; padding: 0 14px; border-radius: 999px; background: var(--fill); font-size: 14px; font-weight: 700; color: var(--ink-2); display: inline-flex; align-items: center; }
.chip.on { background: var(--ink); color: #fff; }
.basis { display: flex; gap: 8px; align-items: center; font-size: 13.5px; color: var(--ink-2); background: var(--fill); padding: 10px 12px; border-radius: 12px; margin-bottom: 8px; }
.basis .ic { font-size: 17px; color: var(--accent); }
.rank { display: flex; align-items: center; gap: 12px; padding: 14px 12px; border-radius: 16px; }
.rank .rn { width: 22px; font-size: 17px; font-weight: 800; color: var(--ink-3); text-align: center; }
.rank .rt { flex: 1; line-height: 1.35; }
.rank .rt b { font-size: 16px; font-weight: 700; }
.rank .rt span { display: block; font-size: 13px; color: var(--ink-3); }
.rank .rs { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; display: flex; align-items: center; gap: 4px; }
.rank .rs .ic { font-size: 18px; color: var(--accent); }
.rank.me { background: var(--accent-soft); }
.rank.me .rt b::after { content: "지금 보는 광고"; font-size: 11.5px; font-weight: 700; color: var(--accent-ink); background: var(--surface); padding: 2px 6px; border-radius: 6px; margin-left: 6px; vertical-align: 2px; }
.rank.low .rs { color: var(--ink-3); }
.rank.low .rs .ic { color: var(--ink-4); }

/* product (step 13) */
.prod-img { width: 390px; height: 320px; }
.prod-info { padding: 18px 20px 0; }
.prod-info .brandn { font-size: 14px; color: var(--ink-3); font-weight: 700; }
.prod-info h3 { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; margin-top: 2px; }
.price { font-size: 24px; font-weight: 800; margin-top: 8px; letter-spacing: -0.02em; }
.price small { font-size: 13px; color: var(--ink-3); font-weight: 500; margin-left: 6px; }
.trust-card { margin-top: 16px; display: flex; align-items: center; gap: 12px; background: var(--accent-soft); border-radius: 16px; padding: 14px; }
.trust-card .big { font-size: 30px; font-weight: 800; color: var(--accent); letter-spacing: -0.03em; }
.trust-card .tt { flex: 1; line-height: 1.4; }
.trust-card .tt b { font-size: 15px; font-weight: 800; color: var(--accent-ink); display: block; }
.trust-card .tt span { font-size: 13px; color: var(--ink-2); }
.buy { position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: 8px; padding: 12px 20px 34px; background: var(--surface); border-top: 1px solid var(--line); }
.buy .cta { margin: 0; }
.buy .cta.ghost { width: 56px; flex: none; font-size: 24px; }
.toast { position: absolute; left: 20px; right: 20px; bottom: 112px; background: rgba(25,31,40,0.94); color: #fff; border-radius: 14px; padding: 13px 16px; font-size: 14.5px; font-weight: 600; display: flex; align-items: center; gap: 8px; z-index: 8; }
.toast .ic { font-size: 20px; color: #8ec0ff; }

/* ======================================================================
   CONSOLE
   ====================================================================== */
.console { width: 1060px; height: 700px; border-radius: 18px; background: var(--surface); box-shadow: var(--shadow-device); overflow: hidden; display: grid; grid-template-columns: 196px 1fr; font-size: 14px; line-height: 1.45; color: var(--ink); }
.c-side { background: #f9fafb; border-right: 1px solid var(--line); padding: 20px 12px; display: flex; flex-direction: column; gap: 2px; }
.c-logo { display: flex; align-items: center; gap: 8px; padding: 0 8px 18px; font-weight: 800; font-size: 16px; letter-spacing: -0.02em; }
.c-logo .brand-mark { width: 28px; height: 28px; border-radius: 9px; font-size: 17px; }
.c-logo small { font-size: 11px; font-weight: 700; color: var(--accent-ink); background: var(--accent-soft); padding: 1px 6px; border-radius: 5px; }
.c-nav { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px; font-size: 14px; font-weight: 500; color: var(--ink-2); }
.c-nav .ic { font-size: 19px; }
.c-nav.on { background: var(--surface); color: var(--ink); font-weight: 700; box-shadow: 0 1px 3px rgba(25,31,40,0.08); }
.c-nav .cnt { margin-left: auto; font-size: 12px; font-weight: 700; color: #fff; background: var(--accent); border-radius: 10px; padding: 0 7px; }
.c-main { display: flex; flex-direction: column; min-width: 0; }
.c-top { height: 60px; display: flex; align-items: center; gap: 12px; padding: 0 24px; border-bottom: 1px solid var(--line); }
.c-crumb { flex: 1; font-size: 14px; color: var(--ink-3); }
.c-crumb b { color: var(--ink); font-weight: 700; }
.c-user { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.c-user .ph { width: 30px; height: 30px; border-radius: 50%; }
.c-body { flex: 1; padding: 18px 24px 22px; display: flex; flex-direction: column; gap: 16px; min-height: 0; background: #f9fafb; }
.stepper { display: flex; align-items: center; gap: 8px; }
.stepper .s { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 700; color: var(--ink-4); }
.stepper .s i { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--fill-2); color: var(--ink-3); font-style: normal; font-size: 12px; }
.stepper .s.done { color: var(--ink-2); }
.stepper .s.done i { background: var(--accent-soft); color: var(--accent); }
.stepper .s.cur { color: var(--ink); }
.stepper .s.cur i { background: var(--accent); color: #fff; }
.stepper .bar { flex: 1; height: 2px; background: var(--fill-2); border-radius: 1px; }
.stepper .bar.done { background: var(--accent); }
.c-grid { flex: 1; display: grid; grid-template-columns: 1.75fr 1fr; gap: 16px; min-height: 0; }
.panel { background: var(--surface); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; min-height: 0; box-shadow: 0 1px 2px rgba(25,31,40,0.05); }
.panel-h { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.panel-h h3 { font-size: 17px; font-weight: 800; letter-spacing: -0.02em; flex: 1; }
.panel-h .ic { font-size: 22px; color: var(--accent); }
.pill { font-size: 12.5px; font-weight: 700; padding: 3px 9px; border-radius: 8px; background: var(--accent-soft); color: var(--accent-ink); display: inline-flex; align-items: center; gap: 4px; }
.pill.gray { background: var(--fill); color: var(--ink-2); }
.pill .ic { font-size: 14px; }
.srcs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 18px; }
.src { background: var(--fill); border-radius: 14px; padding: 14px; }
.src .ic { font-size: 22px; color: var(--ink-2); }
.src b { display: block; font-size: 26px; font-weight: 800; letter-spacing: -0.02em; margin-top: 8px; line-height: 1.1; }
.src span { font-size: 13px; color: var(--ink-3); font-weight: 500; }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { text-align: left; font-size: 12.5px; font-weight: 700; color: var(--ink-3); padding: 0 8px 8px; }
.tbl td { padding: 12px 8px; border-top: 1px solid var(--line); vertical-align: middle; }
.tbl td:first-child { font-weight: 700; }
.tbl td.muted { color: var(--ink-3); }
.filter-big { font-size: 15px; color: var(--ink-2); margin-bottom: 14px; line-height: 1.5; }
.filter-big b { font-size: 30px; font-weight: 800; color: var(--ink); letter-spacing: -0.03em; display: block; line-height: 1.2; }
.xl { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.xl li { display: flex; align-items: center; gap: 10px; padding: 10px 0; font-size: 14px; }
.xl li + li { border-top: 1px solid var(--line); }
.xl li .ic { font-size: 18px; color: var(--ink-4); }
.xl li span { flex: 1; }
.xl li b { font-weight: 700; color: var(--ink-2); }
.c-cta { margin-top: auto; height: 46px; border-radius: 12px; background: var(--accent); color: #fff; font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 6px; }
.c-cta.ghost { background: var(--fill); color: var(--ink); }
.c-actions { margin-top: auto; display: grid; grid-template-columns: 1fr 1.4fr; gap: 8px; }

.doc { background: var(--fill); border-radius: 14px; padding: 16px; display: flex; gap: 14px; align-items: center; margin-bottom: 14px; }
.doc .di { width: 44px; height: 54px; border-radius: 8px; background: var(--surface); display: grid; place-items: center; font-size: 24px; color: var(--accent); box-shadow: 0 1px 3px rgba(25,31,40,0.1); }
.doc b { font-size: 15px; font-weight: 700; display: block; }
.doc span { font-size: 13px; color: var(--ink-3); }
.kv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kv div { background: var(--fill); border-radius: 12px; padding: 12px; }
.kv b { display: block; font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
.kv span { font-size: 12.5px; color: var(--ink-3); }
.person { display: flex; align-items: center; gap: 12px; padding-bottom: 14px; border-bottom: 1px solid var(--line); margin-bottom: 6px; }
.person .ph { width: 48px; height: 48px; border-radius: 50%; flex: none; }
.person b { display: block; font-size: 15.5px; font-weight: 800; }
.person span { font-size: 13px; color: var(--ink-3); }
.checks { list-style: none; margin: 0; padding: 0; }
.checks li { display: grid; grid-template-columns: 24px 1fr; gap: 10px; padding: 12px 0; }
.checks li + li { border-top: 1px solid var(--line); }
.checks .ic { font-size: 24px; color: var(--accent); }
.checks .ic.no { color: var(--ink-4); }
.checks b { font-size: 15px; font-weight: 700; display: block; line-height: 1.4; }
.checks span { font-size: 13.5px; color: var(--ink-2); line-height: 1.5; display: block; margin-top: 2px; }
.checks q { quotes: "‘" "’"; font-weight: 700; color: var(--ink); }
.done-banner { margin-top: auto; display: flex; align-items: center; gap: 12px; background: var(--accent); color: #fff; border-radius: 14px; padding: 14px 16px; }
.done-banner .ic { font-size: 30px; }
.done-banner b { font-size: 17px; font-weight: 800; display: block; }
.done-banner span { font-size: 13px; opacity: 0.85; }
.preview { display: grid; grid-template-columns: 150px 1fr; gap: 16px; align-items: start; }
.preview .ph { width: 150px; height: 150px; border-radius: 14px; }
.preview .pv-h { font-size: 22px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.25; }
.preview .pv-s { font-size: 14px; color: var(--ink-2); margin-top: 4px; }
.mini-claims { margin-top: 14px; display: flex; flex-direction: column; gap: 6px; }
.mini-claims div { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; font-size: 13.5px; font-weight: 600; }
.mini-claims .ic { font-size: 18px; color: var(--accent); }
.mini-claims .ic.no { color: var(--ink-4); }
.memo { margin-top: 16px; background: var(--fill); border-radius: 12px; padding: 12px 14px; font-size: 13.5px; color: var(--ink-2); line-height: 1.55; }
.memo b { color: var(--ink); }

/* ---------- Motion (authored moments) ---------- */
@media (prefers-reduced-motion: no-preference) {
  .play .sheet { animation: sheet-in 420ms var(--ease-drawer) both; }
  .play .dim { animation: fade-in 300ms ease both; }
  .play .ring { animation: ring 1.4s var(--ease-out) 300ms 2 both; }
  .play .tap { animation: tap 900ms var(--ease-out) 200ms both; }
  .play .pop { animation: pop 320ms var(--ease-out) both; animation-delay: calc(var(--i, 0) * 70ms + 650ms); }
  .play .stamp { animation: stamp 360ms var(--ease-out) 380ms both; }
  .play .toast { animation: toast-in 360ms var(--ease-out) 500ms both; }
  .play .flag-q { animation: pop 320ms var(--ease-out) 350ms both; }
}
@media (prefers-reduced-motion: reduce) {
  .swap, .swap.out { transform: none; filter: none; }
  .feed-scroll { transition: none; }
}
@keyframes sheet-in { from { transform: translateY(100%); } to { transform: translateY(0); } }
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes ring { 0% { opacity: 0.9; transform: scale(1); } 100% { opacity: 0; transform: scale(1.18); } }
@keyframes tap { 0% { opacity: 0; transform: scale(1.4); } 40% { opacity: 1; transform: scale(0.92); } 100% { opacity: 1; transform: scale(1); } }
@keyframes pop { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
@keyframes stamp { 0% { opacity: 0; transform: scale(1.08); } 100% { opacity: 1; transform: scale(1); } }
@keyframes toast-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

/* ---------- Narrow screens ---------- */
@media (max-width: 1100px) {
  body { overflow: auto; height: auto; }
  html { height: auto; }
  .shell { display: flex; flex-direction: column; height: auto; }
  .rail { padding: 16px 12px 12px; border-radius: 20px; }
  .brand { padding: 0 6px 12px; }
  .rail-list { flex-direction: row; overflow-x: auto; overflow-y: hidden; gap: 14px; padding-bottom: 4px; }
  .rail-group { flex: none; }
  .rail-group ol { flex-direction: row; }
  .rail-item { white-space: nowrap; padding: 6px 10px 6px 6px; font-size: 14px; }
  .rail-foot, .rail-group h2 { display: none; }
  .main, .main.is-console { grid-template-columns: minmax(0, 1fr); gap: 20px; padding: 20px 4px; }
  .copy-body { gap: 14px; padding-bottom: 16px; }
  .step-no { font-size: 52px; }
  .step-title { font-size: 28px; }
  .step-desc { font-size: 17px; }
  .bubble { font-size: 18px; }
  .nav { order: 3; }
  .kbd { display: none; }
  .stage { order: 2; }
}

<script>
(() => {
  const ic = (n, c = '') => `<svg class="ic ${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
  const IMG = {
    'ad-hero': ['ad-hero.png', '1024×1024', '온도랩 수분 앰플 광고 이미지'],
    'product': ['product.png', '1024×1024', '온도랩 수분 앰플 제품 사진'],
    'feed-post': ['feed-post.png', '1024×1024', '피드의 일반 게시물 사진'],
    'consumer': ['consumer.png', '1024×1024', '소비자 프로필 사진'],
    'reviewer': ['reviewer.png', '1024×1024', '외부 기관 연구원 프로필 사진'],
    'marketer': ['marketer.png', '1024×1024', '마케팅 담당자 프로필 사진'],
  };
  const img = (key, cls = '') => {
    const [file, size, alt] = IMG[key];
    return `<span class="ph ${cls}" role="img" aria-label="${alt}"><span class="ph-label">${ic('image')}<b>${file}</b><small>${size}</small></span><img src="img/${file}" alt=""></span>`;
  };
  const mono = (t, bg) => `<span class="avatar mono" style="background:${bg}">${t}</span>`;

  /* ---------- phone parts ---------- */
  const statusbar = (light) => `
    <div class="island"></div>
    <div class="statusbar" style="${light ? 'color:#fff' : ''}"><span>9:41</span>
      <span class="sb-r"><span class="sb-bars"><i style="height:4px"></i><i style="height:6px"></i><i style="height:9px"></i><i style="height:12px"></i></span><span class="sb-batt"><i></i></span></span>
    </div>`;
  const tabbar = () => `<div class="tabbar">${ic('house', 'on')}${ic('magnifying-glass')}${ic('plus')}${ic('heart')}${ic('storefront')}</div>`;
  const phone = (inner, opts = {}) => `<div class="phone"><div class="screen">${statusbar(opts.light)}${inner}<div class="home-ind" style="${opts.homeLight ? 'background:#fff' : ''}"></div></div></div>`;

  const adPost = (o = {}) => {
    let trust;
    if (o.trust === 'score') {
      trust = `<span class="score-chip pop" style="--i:0" data-go="10">${ic('shield-check-f')}신뢰도 <b data-count="91">91</b></span>
        <span class="badge pop" style="--i:1">${ic('check-circle-f')}검증 완료</span>
        <span class="badge pop" style="--i:2">${ic('user-check')}담당자 검수</span>`;
    } else if (o.trust === 'badges') {
      trust = `<span class="score-chip">${ic('shield-check-f')}신뢰도 <b>91</b></span>
        <span class="badge">${ic('check-circle-f')}근거 확인</span>

    { name: '다시 소비자', who: '소비자 화면', icon: 'device-mobile', steps: [9, 10, 11, 12, 13] },
  ];
  const STEPS = {
    1: { short: '광고 노출', title: '스크롤하다 AI로 만든 스킨케어 광고를 본다', desc: '피드에 ‘피부 변화 7일!’ 광고가 나타납니다. 광고에는 AI 생성 표시와 ‘광고 신뢰 정보’ 버튼이 함께 붙어 있습니다.' },
    2: { short: '의심', title: '광고를 보고 의심이 든다', desc: '7일 만에 피부가 달라진다는 말, 근거가 있을까요? AI로 만든 광고가 늘수록 소비자는 문구를 그대로 믿기 어렵습니다.', reaction: '진짜일까?' },
    3: { short: '신뢰 정보 탭', title: '‘광고 신뢰 정보’ 버튼을 누른다', desc: '광고를 떠나지 않고, 광고 바로 아래 버튼 하나로 근거를 확인합니다.' },
    4: { short: 'AI 활용 고지', title: 'AI 활용 여부와 제작 방식을 확인한다', desc: '어떤 부분을 AI가 만들었고 어디에 사람이 손댔는지 먼저 알려 줍니다.' },
    5: { short: '주장 검증 결과', title: '제품의 주장을 검증 완료와 근거 부족으로 나눠 본다', desc: '광고 속 주장마다 검증 상태를 보여 줍니다. 근거가 없는 주장도 숨기지 않고 같은 자리에 표시합니다.', point: '근거 부족도 정보입니다. 확인된 것과 아닌 것을 함께 보여 줍니다.' },
    6: { short: 'AI 근거 수집', title: 'AI가 먼저 여러 출처에서 근거를 모은다', desc: '5단계의 검증 결과는 광고 게재 전에 만들어집니다. AI가 논문, 시험 결과, 전문 기관, 공식 자료를 모아 주장과 연결하고 허위·과장 자료를 걸러냅니다.' },
    7: { short: '외부 기관 검토', title: '외부 전문 기관이 근거를 검토한다', desc: 'AI가 정리한 근거를 외부 전문 기관이 다시 봅니다. 근거의 타당성, 효과·표현, 과장 여부를 확인합니다.' },
    8: { short: '담당자 승인', title: '마케팅 담당자가 최종 검토하고 승인한다', desc: '마지막 책임은 사람이 집니다. 담당자가 주장과 근거, 표현을 확인한 뒤 승인하거나 수정을 요청합니다.', point: 'AI, 외부 기관, 담당자. 세 단계를 거친 광고만 신뢰도와 배지를 받습니다.' },
    9: { short: '신뢰도 표시', title: '검증을 마친 광고에 신뢰도가 표시된다', desc: '광고 아래에 신뢰도 점수와 ‘검증 완료’, ‘담당자 검수’ 배지가 붙습니다.' },
    10: { short: '출처·검수 내역', title: '점수를 누르면 출처와 검수 내역이 보인다', desc: '출처와 근거, 언제 누가 검수했는지, 문제가 생기면 기업이 어떻게 책임지는지까지 탭으로 나눠 보여 줍니다.' },
    11: { short: '브랜드 랭킹', title: '브랜드별 신뢰도를 비교한다', desc: '인기순이 아니라 근거를 얼마나 투명하게 공개했는지로 브랜드를 비교합니다.' },
    12: { short: '배지로 확인', title: '배지를 보고 광고를 믿게 된다', desc: '다음에 광고를 볼 때는 배지만 봐도 근거가 확인됐고 담당자가 검수했다는 것을 알 수 있습니다.', reaction: '확실히 믿을 수 있네!' },
    13: { short: '안심 구매', title: '정보를 바탕으로 안심하고 구매한다', desc: '기업은 먼저 검증하고, 소비자는 편리하게 선택합니다.', reaction: '이제 믿고 사도 되겠다!' },
  };
  const TOTAL = 13;
  const groupOf = (n) => GROUPS.find((g) => g.steps.includes(n));
  const isConsole = (n) => n >= 6 && n <= 8;

  /* ---------- rail ---------- */
  const rail = document.getElementById('rail');
  rail.innerHTML = GROUPS.map((g) => `
    <div class="rail-group"><h2>${g.name}</h2><ol>${g.steps.map((n) => `
      <li><button class="rail-item" type="button" data-step="${n}"><span class="n">${n}</span>${STEPS[n].short}</button></li>`).join('')}
    </ol></div>`).join('');

  /* ---------- render ---------- */
  const copyEl = document.getElementById('copy');
  const deviceEl = document.getElementById('device');
  const boxEl = document.getElementById('deviceBox');
  const stageEl = document.getElementById('stage');
  const mainEl = document.getElementById('main');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)');
  let current = 0;
  let clean = false;

  function copyHTML(n) {
    const s = STEPS[n], g = groupOf(n);
    return `
      <span class="who">${ic(g.icon)}${g.who}</span>
      <p class="step-no">${String(n).padStart(2, '0')}<small>/ ${TOTAL}</small></p>
      <h1 class="step-title">${s.title}</h1>
      <p class="step-desc">${s.desc}</p>
      ${s.point ? `<p class="point">${ic('seal-check-f')}<span>${s.point}</span></p>` : ''}
      ${s.reaction ? `<div class="reaction">${img('consumer', 'sm')}<span class="bubble">${s.reaction}</span></div>` : ''}
      <p class="clean-note">확인필 시연 화면. 브랜드, 기관, 인물, 수치는 가상 예시입니다.</p>`;
  }

  function fit() {
    const d = deviceEl.firstElementChild;
    if (!d) return;
    const W = d.offsetWidth, H = d.offsetHeight;
    const narrow = matchMedia('(max-width: 1100px)').matches;
    const aw = stageEl.clientWidth, ah = narrow ? Infinity : stageEl.clientHeight;
    const s = Math.min(1, aw / W, ah / H);
    deviceEl.style.transform = `scale(${s})`;
    boxEl.style.width = `${W * s}px`;
    boxEl.style.height = `${H * s}px`;
  }

  function countUp(root) {
    root.querySelectorAll('[data-count]').forEach((el) => {
      const to = +el.dataset.count;
      if (reduce.matches) { el.textContent = to; return; }
      const t0 = performance.now() + 650, dur = 900;
      el.textContent = '0';
      const tick = (t) => {
        const p = Math.min(1, Math.max(0, (t - t0) / dur));
        el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3)));
        if (p < 1) requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    });
  }

  function paint(n) {
    copyEl.innerHTML = copyHTML(n);
    deviceEl.innerHTML = S[n]();
    deviceEl.classList.remove('play'); void deviceEl.offsetWidth; deviceEl.classList.add('play');
    mainEl.classList.toggle('is-console', isConsole(n));
    fit();
    countUp(deviceEl);
  }

  function go(n, { push = true } = {}) {
    n = Math.max(1, Math.min(TOTAL, n));
    if (n === current) return;
    const first = current === 0;
    current = n;
    rail.querySelectorAll('.rail-item').forEach((b) => {
      const k = +b.dataset.step;
      b.toggleAttribute('aria-current', k === n);
      if (k === n) b.setAttribute('aria-current', 'step');
      b.classList.toggle('done', k < n);
    });
    const active = rail.querySelector('[aria-current="step"]');
    if (active && rail.scrollWidth > rail.clientWidth) active.scrollIntoView({ block: 'nearest', inline: 'center' });
    document.getElementById('prev').disabled = n === 1;
    document.getElementById('next').disabled = n === TOTAL;
    if (push) {
      const h = `#${clean ? 'clean' : 'step'}-${n}`;
      if (location.hash !== h) history.replaceState(null, '', h);
    }
    if (first || reduce.matches) { paint(n); return; }
    copyEl.classList.add('out'); deviceEl.classList.add('out');
    setTimeout(() => { paint(n); copyEl.classList.remove('out'); deviceEl.classList.remove('out'); }, 120);
  }

  function setClean(on) {
    clean = on;
    document.body.classList.toggle('clean', on);
    history.replaceState(null, '', `#${on ? 'clean' : 'step'}-${current}`);
    requestAnimationFrame(fit);
  }

  function fromHash() {
    const m = /^#(step|clean)-(\d{1,2})$/.exec(location.hash);
    if (!m) return go(current || 1, { push: false });
    const on = m[1] === 'clean';
    if (on !== clean) { clean = on; document.body.classList.toggle('clean', on); }
    go(+m[2], { push: false });
    requestAnimationFrame(fit);
  }

  /* ---------- events ---------- */
  rail.addEventListener('click', (e) => { const b = e.target.closest('[data-step]'); if (b) go(+b.dataset.step); });
  document.getElementById('prev').addEventListener('click', () => go(current - 1));
  document.getElementById('next').addEventListener('click', () => go(current + 1));
  document.getElementById('clean').addEventListener('click', () => setClean(true));
  document.getElementById('cleanExit').addEventListener('click', () => setClean(false));
  document.addEventListener('keydown', (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey || e.target.closest('input, textarea')) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); go(current + 1); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(current - 1); }
    else if (e.key === 'Home') go(1);
    else if (e.key === 'End') go(TOTAL);
    else if (e.key === 'c' || e.key === 'C') setClean(!clean);
    else if (e.key === 'Escape' && clean) setClean(false);
  });
  deviceEl.addEventListener('click', (e) => {
    const g = e.target.closest('[data-go]');
    if (g) { go(+g.dataset.go); return; }
    const t = e.target.closest('[data-tab]');
    if (!t) return;
    const sheet = t.closest('.sheet');
    sheet.querySelectorAll('[data-tab]').forEach((b) => b.setAttribute('aria-selected', b === t));
    sheet.querySelectorAll('[data-panel]').forEach((p) => { p.hidden = p.dataset.panel !== t.dataset.tab; });
  });
  document.addEventListener('load', (e) => {
    if (e.target.tagName === 'IMG' && e.target.closest('.ph')) e.target.classList.add('loaded');
  }, true);
  window.addEventListener('hashchange', fromHash);
  new ResizeObserver(fit).observe(stageEl);
  fromHash();
})();
</script>
