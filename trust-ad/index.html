<title>확인필 광고 신뢰 시연</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#eef1f4">
<meta name="description" content="AI 광고를 기업이 먼저 검증하고 소비자가 한 번의 탭으로 근거를 확인하는 13단계 흐름 시연 화면">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* Layout: 왼쪽 단계 바 + 가운데 설명 + 오른쪽 실제 화면(휴대폰 또는 콘솔). 1920x1080 캡처 한 장 = 슬라이드 한 장.
   표준 핀테크 앱 문법. 밝은 단일 테마(발표장 투사·캡처용)로 고정. */
:root {
  --canvas: #eef1f4;
  --surface: #ffffff;
  --fill: #f2f4f6;
  --fill-2: #e8ebee;
  --line: #e5e8eb;
  --ink: #191f28;
  --ink-2: #4e5968;
  --ink-3: #6b7684;
  --ink-4: #8b95a1;
  --accent: #1f6fe5;
  --accent-press: #1857c4;
  --accent-soft: #e8f3ff;
  --accent-ink: #1957c2;
  --like: #e5394a;
  --star: #f5a623;
  --gov: #16325c;
  --gov-press: #0f2547;
  --gov-soft: #e9eef6;
  --scrim: rgba(0, 12, 30, 0.48);
  --photo-bg: #d4d3d6;
  --brand-ondo: #2b3542;
  --brand-gyeol: #3d6b5a;
  --brand-mir: #8a6a52;
  --brand-haru: #a5741f;
  --brand-soi: #5a6b8a;
  --shadow-device: 0 30px 60px -20px rgba(25, 31, 40, 0.28), 0 12px 24px -12px rgba(25, 31, 40, 0.16);
  --shadow-sheet: 0 -8px 24px rgba(25, 31, 40, 0.08);
  --font: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
  --r-card: 16px;
  --r-ctl: 12px;
  color-scheme: light;
}

html { -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; height: 100%; }
body {
  margin: 0; height: 100%;
  background: var(--canvas); color: var(--ink);
  font-family: var(--font); font-size: 16px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  font-variant-numeric: tabular-nums;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px;
  box-sizing: border-box;
  overflow: hidden;
}
*, *::before, *::after { box-sizing: border-box; }
::selection { background: var(--accent-soft); color: var(--accent-ink); }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; text-align: inherit; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.ic { width: 1em; height: 1em; fill: currentColor; flex: none; display: inline-block; vertical-align: -0.125em; }
h1, h2, h3, h4, p { margin: 0; }
.press { transition: transform 120ms var(--ease-out), background-color 160ms ease, color 160ms ease; }
.press:active:not(:disabled) { transform: scale(0.97); }

/* ---------- Shell ---------- */
.shell { height: 100%; display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 16px; }
.rail { background: var(--surface); border-radius: 24px; padding: 28px 18px 20px; display: flex; flex-direction: column; min-height: 0; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 10px 22px; }
.brand-mark { width: 36px; height: 36px; border-radius: 11px; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 22px; flex: none; }
.brand b { font-size: 21px; font-weight: 800; letter-spacing: -0.02em; }
.brand span { display: block; font-size: 12.5px; color: var(--ink-3); font-weight: 500; line-height: 1.3; }
.rail-list { flex: 1; overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; gap: 14px; scrollbar-width: none; }
.rail-group h2 { font-size: 13px; font-weight: 700; color: var(--ink-3); padding: 0 10px 6px; letter-spacing: 0.01em; }
.rail-group ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.rail-item { width: 100%; display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 12px; font-size: 15.5px; font-weight: 500; color: var(--ink-2); transition: background-color 160ms ease, color 160ms ease, transform 120ms var(--ease-out); }
.rail-item .n { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; flex: none; font-size: 13px; font-weight: 700; background: var(--fill); color: var(--ink-3); transition: background-color 160ms ease, color 160ms ease; }
.rail-item.done .n { background: var(--fill-2); color: var(--ink-2); }
.rail-item[aria-current="step"] { background: var(--accent-soft); color: var(--accent-ink); font-weight: 700; }
.rail-item[aria-current="step"] .n { background: var(--accent); color: #fff; }
.rail-item:active { transform: scale(0.98); }
@media (hover: hover) and (pointer: fine) { .rail-item:not([aria-current="step"]):hover { background: var(--fill); } }
.rail-foot { padding: 14px 10px 0; font-size: 12.5px; color: var(--ink-3); line-height: 1.5; border-top: 1px solid var(--line); margin-top: 12px; }

/* ---------- Main ---------- */
.main { position: relative; min-width: 0; min-height: 0; display: grid; grid-template-columns: minmax(320px, 520px) minmax(0, 620px); justify-content: center; column-gap: 72px; padding: 32px 40px 28px 48px; }
.main.is-console { grid-template-columns: minmax(300px, 380px) minmax(0, 1fr); justify-content: stretch; column-gap: 36px; }
.copy { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.copy-body { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 22px; padding-bottom: 24px; }
.who { display: inline-flex; align-items: center; gap: 8px; align-self: flex-start; padding: 7px 14px 7px 12px; border-radius: 999px; background: var(--surface); font-size: 15px; font-weight: 700; color: var(--ink-2); }
.who .ic { font-size: 18px; color: var(--accent); }
.who.gov .ic { color: var(--gov); }
.step-no { font-size: 76px; line-height: 1; font-weight: 800; letter-spacing: -0.03em; color: var(--accent); }
.step-no small { font-size: 28px; color: var(--ink-4); font-weight: 700; margin-left: 6px; letter-spacing: 0; }
.step-title { font-size: 40px; line-height: 1.3; font-weight: 800; letter-spacing: -0.03em; text-wrap: balance; word-break: keep-all; }
.step-desc { font-size: 20px; line-height: 1.65; color: var(--ink-2); max-width: 30em; word-break: keep-all; text-wrap: pretty; }
.point { display: flex; gap: 10px; align-items: flex-start; font-size: 17px; line-height: 1.55; color: var(--ink); background: var(--surface); padding: 14px 16px; border-radius: var(--r-card); word-break: keep-all; }
.point .ic { font-size: 20px; color: var(--accent); margin-top: 2px; }
.reaction { display: flex; align-items: center; gap: 14px; }
.reaction .ph { width: 64px; height: 64px; border-radius: 50%; flex: none; }
.bubble { position: relative; background: var(--ink); color: #fff; font-size: 22px; font-weight: 700; padding: 14px 20px; border-radius: 20px; letter-spacing: -0.02em; }
.bubble::before { content: ""; position: absolute; left: -6px; top: 50%; width: 14px; height: 14px; background: inherit; transform: translateY(-50%) rotate(45deg); border-radius: 3px; }
.hint { display: flex; gap: 8px; align-items: center; font-size: 15px; color: var(--ink-3); }
.hint .ic { font-size: 18px; color: var(--accent); }

.nav { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.btn { height: 52px; padding: 0 22px; border-radius: 14px; font-size: 17px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; transition: transform 120ms var(--ease-out), background-color 160ms ease; }
.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--accent); color: #fff; }
.btn-ghost { background: var(--surface); color: var(--ink); }
@media (hover: hover) and (pointer: fine) { .btn-primary:hover { background: var(--accent-press); } .btn-ghost:hover { background: var(--fill-2); } }
.btn:disabled { opacity: 0.4; pointer-events: none; }
.btn .ic { font-size: 18px; }
.kbd { font-size: 13.5px; color: var(--ink-3); margin-left: auto; }
.kbd kbd { font: inherit; font-weight: 700; background: var(--surface); border-radius: 6px; padding: 2px 7px; color: var(--ink-2); }

.stage { position: relative; min-width: 0; min-height: 0; display: grid; place-items: center; }
.device-box { position: relative; }
.device { position: absolute; left: 0; top: 0; transform-origin: 0 0; }

/* ---------- Clean (capture-only) mode ---------- */
body.clean .rail, body.clean .nav, body.clean .hint { display: none; }
body.clean .shell { grid-template-columns: minmax(0, 1fr); }
body.clean .main { padding-inline: 96px; }
.clean-note { display: none; font-size: 14px; color: var(--ink-3); }
body.clean .clean-note { display: block; }
.clean-exit { position: fixed; right: max(20px, env(safe-area-inset-right, 0px)); bottom: 20px; display: none; }
body.clean .clean-exit { display: inline-flex; opacity: 0; transition: opacity 200ms ease; }
body.clean .clean-exit:focus-visible { opacity: 1; }
@media (hover: hover) and (pointer: fine) { body.clean .clean-exit:hover { opacity: 1; } }

/* ---------- Swap transition ---------- */
.swap { transition: opacity 240ms var(--ease-out), transform 240ms var(--ease-out), filter 240ms var(--ease-out); }
.swap.out { opacity: 0; transform: translateY(6px); filter: blur(2px); transition-duration: 120ms; }

/* ---------- Images ---------- */
.ph { position: relative; display: block; overflow: hidden; background: repeating-linear-gradient(135deg, #eceff2 0 12px, #e4e8ec 12px 24px); }
.ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 200ms ease; }
.ph img.loaded { opacity: 1; }
.ph:has(img.loaded) .ph-label { visibility: hidden; }
.ph-label { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--ink-3); text-align: center; padding: 8px; }
.ph-label .ic { font-size: 26px; margin-bottom: 4px; }
.ph-label b { font-size: 13px; font-weight: 700; color: var(--ink-2); }
.ph-label small { font-size: 12px; }
.ph.sm .ph-label b, .ph.sm .ph-label small { display: none; }
.ph.sm .ph-label .ic { font-size: 20px; margin: 0; }
.ph.photo { background: var(--photo-bg); }
/* 광고 이미지: 병을 오른쪽으로 옮겨 왼쪽 위에 카피 자리를 만든다. 비는 왼쪽은 사진 가장자리 색으로 채운다. */
.ph.ad-img { background: linear-gradient(#f1f0f1, #e1e0e3 25%, #cccbcd 50%, #c5c4c6 75%, #cbcbcd); }
.ph.ad-img img { inset: 0 auto 0 78px; width: 390px; -webkit-mask-image: linear-gradient(to right, transparent, #000 56px); mask-image: linear-gradient(to right, transparent, #000 56px); }
.ph.prod-img { background: linear-gradient(to right, #dcdbdd, #c9c8ca 50%, #b9b8ba); }
.ph.prod-img img { object-fit: contain; -webkit-mask-image: linear-gradient(to right, transparent, #000 40px, #000 calc(100% - 40px), transparent); mask-image: linear-gradient(to right, transparent, #000 40px, #000 calc(100% - 40px), transparent); }

/* ======================================================================
   PHONE
   ====================================================================== */
.phone { width: 414px; height: 868px; border-radius: 62px; background: #101318; padding: 12px; box-shadow: var(--shadow-device); }
.screen { position: relative; width: 390px; height: 844px; border-radius: 50px; overflow: hidden; background: var(--surface); font-size: 15px; line-height: 1.45; color: var(--ink); }
.island { position: absolute; top: 11px; left: 50%; width: 120px; height: 34px; margin-left: -60px; border-radius: 20px; background: #101318; z-index: 60; }
.statusbar { position: absolute; top: 0; left: 0; right: 0; height: 54px; display: flex; align-items: center; justify-content: space-between; padding: 6px 34px 0 40px; font-size: 16px; font-weight: 700; z-index: 55; pointer-events: none; }
.statusbar .sb-r { display: flex; gap: 6px; align-items: center; }
.sb-bars { display: flex; gap: 2px; align-items: flex-end; height: 12px; }
.sb-bars i { width: 3px; background: currentColor; border-radius: 1px; }
.sb-batt { width: 25px; height: 12px; border: 1.5px solid currentColor; border-radius: 4px; padding: 1.5px; opacity: 0.9; }
.sb-batt i { display: block; height: 100%; width: 78%; background: currentColor; border-radius: 1.5px; }
.home-ind { position: absolute; bottom: 8px; left: 50%; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: var(--ink); z-index: 70; pointer-events: none; }
.view { position: absolute; inset: 54px 0 0 0; overflow: hidden; }
.scroll { overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; }
.scroll::-webkit-scrollbar { display: none; }
.icon-btn { width: 40px; height: 40px; display: inline-grid; place-items: center; border-radius: 12px; font-size: 25px; transition: background-color 120ms ease; }
.icon-btn:active { background: var(--fill); }

.appbar { height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px 0 18px; background: var(--surface); position: relative; z-index: 3; }
.appbar .logo { font-size: 23px; font-weight: 800; letter-spacing: -0.03em; }
.appbar .acts { display: flex; gap: 2px; }
.navbar { height: 52px; display: flex; align-items: center; gap: 8px; padding: 0 8px; font-size: 18px; font-weight: 700; background: var(--surface); position: relative; z-index: 3; }
.navbar .t { flex: 1; text-align: center; margin-right: 48px; }
.navbar .icon-btn { font-size: 24px; }

.tabbar { position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: var(--surface); border-top: 1px solid var(--line); display: flex; justify-content: space-around; padding-top: 6px; color: var(--ink-3); z-index: 5; }
.tabbar .icon-btn { font-size: 26px; }
.tabbar .on { color: var(--ink); }

/* feed */
.feed-clip { position: absolute; left: 0; right: 0; top: 52px; bottom: 84px; }
.post-h { height: 58px; display: flex; align-items: center; gap: 10px; padding: 0 6px 0 14px; }
.avatar { width: 36px; height: 36px; border-radius: 50%; flex: none; }
.mono { display: grid; place-items: center; font-weight: 800; color: #fff; font-size: 15px; }
.post-h .who-t { flex: 1; line-height: 1.3; }
.post-h .who-t b { font-size: 14.5px; font-weight: 700; display: block; }
.post-h .who-t span { font-size: 12.5px; color: var(--ink-3); }
.post-h .icon-btn { font-size: 22px; color: var(--ink-2); }
.tag-ai { display: inline-flex; align-items: center; gap: 3px; font-size: 11.5px; font-weight: 700; color: var(--accent-ink); background: var(--accent-soft); padding: 1px 7px; border-radius: 6px; margin-left: 4px; vertical-align: 1px; }
.post-img { width: 390px; height: 390px; }
.post-img.short { height: 300px; }
.post-actions { display: flex; gap: 2px; padding: 4px 6px 0; }
.post-actions .sp { flex: 1; }
.post-actions .icon-btn.liked { color: var(--like); }
.likes { padding: 0 14px; font-size: 14px; font-weight: 700; }
.caption { padding: 2px 14px 16px; font-size: 14px; color: var(--ink); }
.caption b { font-weight: 700; margin-right: 6px; }

.ad-wrap { position: relative; }
.ad-copy { position: absolute; left: 20px; top: 22px; right: 170px; z-index: 2; pointer-events: none; }
.ad-copy .h { font-size: 38px; line-height: 1.15; font-weight: 800; letter-spacing: -0.04em; display: inline-block; padding: 2px 6px; margin-left: -6px; border-radius: 10px; }
.ad-copy .s { font-size: 15px; font-weight: 700; color: var(--ink-2); margin-top: 6px; }
.ad-badge { position: absolute; right: 14px; top: 14px; z-index: 2; font-size: 11px; font-weight: 800; letter-spacing: 0.06em; color: var(--ink-2); background: rgba(255,255,255,0.85); padding: 3px 7px; border-radius: 6px; }
.ad-copy .h.flag { box-shadow: 0 0 0 2.5px var(--accent); background: rgba(232, 243, 255, 0.85); }
.flag-q { position: absolute; z-index: 3; left: 150px; top: 8px; width: 34px; height: 34px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 22px; box-shadow: 0 6px 14px -4px rgba(31,111,229,0.55); }

.cta-row { width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; font-size: 14.5px; font-weight: 700; background: var(--fill); transition: background-color 120ms ease; }
.cta-row:active { background: var(--fill-2); }
.trust-row { display: flex; align-items: center; gap: 8px; padding: 10px 14px 4px; position: relative; flex-wrap: wrap; }
.trust-btn { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px 0 10px; border-radius: 10px; background: var(--accent-soft); color: var(--accent-ink); font-size: 14px; font-weight: 700; position: relative; }
.trust-btn .ic { font-size: 18px; }
.trust-btn.hot { background: var(--accent); color: #fff; }
.tap { position: absolute; width: 46px; height: 46px; border-radius: 50%; background: rgba(25,31,40,0.22); border: 2px solid rgba(255,255,255,0.9); left: 112px; top: 6px; pointer-events: none; }
.ring { position: absolute; inset: -6px; border-radius: 14px; border: 2px solid var(--accent); opacity: 0; pointer-events: none; }
.score-chip { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px 0 8px; border-radius: 10px; background: var(--accent); color: #fff; font-size: 14px; font-weight: 700; }
.score-chip .ic { font-size: 19px; }
.score-chip b { font-size: 17px; font-weight: 800; }
.badge { display: inline-flex; align-items: center; gap: 4px; height: 30px; padding: 0 10px 0 7px; border-radius: 9px; background: var(--accent-soft); color: var(--accent-ink); font-size: 13px; font-weight: 700; }
.badge .ic { font-size: 16px; }

/* sheet */
.dim { position: absolute; inset: 0; background: var(--scrim); z-index: 20; width: 100%; cursor: default; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 22; background: var(--surface); border-radius: 24px 24px 0 0; padding: 10px 22px 34px; box-shadow: var(--shadow-sheet); }
.grabber { width: 40px; height: 5px; border-radius: 3px; background: var(--fill-2); margin: 0 auto 14px; }
.sheet-h { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.sheet-h h3 { font-size: 21px; font-weight: 800; letter-spacing: -0.02em; }
.sheet-h .icon-btn { color: var(--ink-3); font-size: 24px; margin-right: -8px; }
.notice { display: flex; gap: 12px; align-items: flex-start; background: var(--accent-soft); border-radius: 14px; padding: 14px; color: var(--ink); }
.notice .ic { font-size: 24px; color: var(--accent); }
.notice b { display: block; font-size: 16px; font-weight: 800; color: var(--accent-ink); }
.notice span { font-size: 14px; color: var(--ink-2); }
.sec-t { font-size: 14px; font-weight: 700; color: var(--ink-3); margin: 22px 0 8px; }
.rows { display: flex; flex-direction: column; }
.row { width: 100%; display: flex; align-items: center; gap: 12px; padding: 11px 0; }
.rows > * + * { border-top: 1px solid var(--line); }
.row .ri { width: 40px; height: 40px; border-radius: 12px; background: var(--fill); display: grid; place-items: center; font-size: 22px; color: var(--ink-2); flex: none; }
.row .rt { flex: 1; min-width: 0; line-height: 1.35; }
.row .rt b { font-size: 15.5px; font-weight: 700; display: block; }
.row .rt span { font-size: 13.5px; color: var(--ink-3); }
.row .rv { font-size: 14px; font-weight: 700; color: var(--ink-2); }
.row > .ic { color: var(--ink-4); font-size: 18px; transition: transform 200ms var(--ease-out); }
.acc.open .row > .ic { transform: rotate(90deg); }
.acc-body { display: none; padding: 0 0 12px 52px; font-size: 13.5px; color: var(--ink-2); line-height: 1.55; }
.acc.open .acc-body { display: block; }
.cta { display: flex; align-items: center; justify-content: center; gap: 6px; height: 56px; border-radius: 16px; background: var(--accent); color: #fff; font-size: 17px; font-weight: 700; width: 100%; margin-top: 18px; }
.cta:disabled { background: var(--fill-2); color: var(--ink-3); }
.cta.ghost { background: var(--fill); color: var(--ink); }
.link-row { width: 100%; display: flex; align-items: center; justify-content: space-between; margin-top: 14px; padding: 14px 16px; border-radius: 14px; background: var(--fill); font-size: 14.5px; font-weight: 700; }
.link-row .ic { color: var(--ink-3); }

/* claims (step 5) */
.page { padding: 4px 20px 120px; }
.page-scroll { position: absolute; left: 0; right: 0; top: 52px; bottom: 0; }
.prod-h { display: flex; gap: 14px; align-items: center; padding: 6px 0 18px; }
.prod-h .ph { width: 64px; height: 64px; border-radius: 16px; flex: none; }
.prod-h b { font-size: 17px; font-weight: 800; display: block; letter-spacing: -0.02em; }
.prod-h span { font-size: 13.5px; color: var(--ink-3); }
.summary { font-size: 25px; font-weight: 800; line-height: 1.35; letter-spacing: -0.03em; margin: 4px 0 18px; }
.summary em { font-style: normal; color: var(--accent); }
.claim { border-radius: 16px; background: var(--fill); }
.claim + .claim { margin-top: 8px; }
.claim-h { width: 100%; display: flex; gap: 12px; align-items: center; padding: 15px; }
.claim .ci { font-size: 28px; flex: none; }
.claim .ci.ok { color: var(--accent); }
.claim .ci.no { color: var(--ink-4); }
.claim .ct { flex: 1; min-width: 0; line-height: 1.35; }
.claim .ct b { font-size: 16px; font-weight: 700; display: block; }
.claim .ct span { font-size: 13px; color: var(--ink-3); }
.claim .acc-body { padding: 0 15px 14px 55px; }
.claim .acc-body ul { margin: 0; padding-left: 16px; }
.claim .acc-body li + li { margin-top: 4px; }
.st { font-size: 12.5px; font-weight: 700; padding: 4px 9px; border-radius: 8px; flex: none; }
.st.ok { background: var(--accent-soft); color: var(--accent-ink); }
.st.no { background: var(--surface); color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line); }
.claim.unk { background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--fill-2); }
.fine { font-size: 12.5px; color: var(--ink-3); margin-top: 14px; display: flex; gap: 6px; align-items: flex-start; }
.fine .ic { font-size: 15px; margin-top: 2px; }
.bottom-cta { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 20px 34px; background: linear-gradient(to bottom, rgba(255,255,255,0), var(--surface) 22%); z-index: 4; }
.bottom-cta .cta { margin-top: 0; }

/* score sheet (step 10) */
.score-h { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; }
.score-big { white-space: nowrap; font-size: 48px; font-weight: 800; letter-spacing: -0.04em; line-height: 1; color: var(--accent); }
.score-big small { font-size: 20px; color: var(--ink-3); font-weight: 700; margin-left: 2px; letter-spacing: 0; }
.score-h p { font-size: 13.5px; color: var(--ink-2); line-height: 1.45; }
.tabs { display: flex; background: var(--fill); border-radius: 12px; padding: 4px; gap: 4px; }
.tabs button { flex: 1; height: 38px; border-radius: 9px; font-size: 14.5px; font-weight: 700; color: var(--ink-3); text-align: center; transition: background-color 160ms ease, color 160ms ease; }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(25,31,40,0.08); }
.tabpanel { min-height: 236px; padding-top: 6px; }
.tl { list-style: none; margin: 8px 0 0; padding: 0; }
.tl li { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: start; padding: 9px 0; position: relative; }
.tl li .dotc { width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 13px; position: relative; z-index: 1; }
.tl li:not(:last-child)::before { content: ""; position: absolute; left: 10px; top: 32px; bottom: -10px; width: 2px; background: var(--accent-soft); }
.tl li b { font-size: 15px; font-weight: 700; display: block; line-height: 1.35; }
.tl li span { font-size: 13px; color: var(--ink-3); }
.tl li time { font-size: 13px; color: var(--ink-3); font-weight: 500; }

/* ranking (step 11) */
.chips { display: flex; gap: 8px; margin: 2px 0 16px; flex-wrap: wrap; }
.chip { height: 34px; padding: 0 14px; border-radius: 999px; background: var(--fill); font-size: 14px; font-weight: 700; color: var(--ink-2); display: inline-flex; align-items: center; transition: background-color 160ms ease, color 160ms ease, transform 120ms var(--ease-out); }
.chip:active { transform: scale(0.96); }
.chip[aria-pressed="true"] { background: var(--ink); color: #fff; }
.chips.sm .chip { height: 30px; padding: 0 12px; font-size: 13px; }
.basis { display: flex; gap: 8px; align-items: center; font-size: 13.5px; color: var(--ink-2); background: var(--fill); padding: 10px 12px; border-radius: 12px; margin-bottom: 8px; }
.basis .ic { font-size: 17px; color: var(--accent); }
.rank { width: 100%; display: flex; align-items: center; gap: 12px; padding: 14px 12px; border-radius: 16px; transition: background-color 120ms ease; }
.rank:active { background: var(--fill); }
.rank .rn { width: 22px; font-size: 17px; font-weight: 800; color: var(--ink-3); text-align: center; }
.rank .rt { flex: 1; line-height: 1.35; }
.rank .rt b { font-size: 16px; font-weight: 700; }
.rank .rt span { display: block; font-size: 13px; color: var(--ink-3); }
.rank .rs { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; display: flex; align-items: center; gap: 4px; }
.rank .rs .ic { font-size: 18px; color: var(--accent); }
.rank.me { background: var(--accent-soft); }
.rank.me .rt b::after { content: "지금 보는 광고"; font-size: 11.5px; font-weight: 700; color: var(--accent-ink); background: var(--surface); padding: 2px 6px; border-radius: 6px; margin-left: 6px; vertical-align: 2px; }
.rank.low .rs { color: var(--ink-3); }
.rank.low .rs .ic { color: var(--ink-4); }

/* product (step 13) */
.prod-scroll { position: absolute; inset: 0; }
.prod-img { width: 390px; height: 210px; }
.prod-back { position: absolute; left: 12px; top: 10px; z-index: 6; width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.9); display: grid; place-items: center; font-size: 22px; box-shadow: 0 2px 8px rgba(25,31,40,0.12); }
.prod-info { padding: 14px 20px 0; }
.prod-info .brandn { font-size: 14px; color: var(--ink-3); font-weight: 700; }
.prod-info h3 { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; margin-top: 2px; }
.price { font-size: 24px; font-weight: 800; margin-top: 8px; letter-spacing: -0.02em; }
.price small { font-size: 13px; color: var(--ink-3); font-weight: 500; margin-left: 6px; }
.trust-card { width: 100%; margin-top: 12px; display: flex; align-items: center; gap: 12px; background: var(--accent-soft); border-radius: 16px; padding: 14px; }
.trust-card .big { font-size: 30px; font-weight: 800; color: var(--accent); letter-spacing: -0.03em; }
.trust-card .tt { flex: 1; line-height: 1.4; }
.trust-card .tt b { font-size: 15px; font-weight: 800; color: var(--accent-ink); display: block; }
.trust-card .tt span { font-size: 13px; color: var(--ink-2); }
.trust-card > .ic { color: var(--accent-ink); }
.reviews { padding: 16px 20px 128px; border-top: 8px solid var(--fill); margin-top: 12px; }
.rv-h { display: flex; align-items: center; gap: 8px; }
.rv-score { flex: 1; display: inline-flex; align-items: center; gap: 4px; font-size: 16px; font-weight: 800; }
.rv-score .ic { color: var(--star); }
.rv-score small { font-size: 13px; font-weight: 500; color: var(--ink-3); }
.rv-note { font-size: 12.5px; color: var(--ink-3); margin: 2px 0 10px; }
.rv-h h4 { font-size: 18px; font-weight: 800; letter-spacing: -0.02em; }
.rv-h button { font-size: 13.5px; font-weight: 700; color: var(--ink-3); }
.stars { display: inline-flex; gap: 1px; color: var(--star); font-size: 16px; }
.stars .off { color: var(--fill-2); }
.review { padding: 14px 0; }
.review + .review { border-top: 1px solid var(--line); }
.rv-top { display: flex; align-items: center; gap: 10px; }
.rv-top .avatar { width: 32px; height: 32px; font-size: 13px; background: var(--fill-2); color: var(--ink-2); }
.rv-top .nm { flex: 1; line-height: 1.3; }
.rv-top .nm b { font-size: 14px; font-weight: 700; }
.rv-top .nm span { display: block; font-size: 12.5px; color: var(--ink-3); }
.verified { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; font-weight: 700; color: var(--accent-ink); background: var(--accent-soft); padding: 2px 7px; border-radius: 6px; }
.verified .ic { font-size: 13px; }
.review .stars { font-size: 13px; margin: 8px 0 4px; }
.review p { font-size: 14.5px; line-height: 1.55; color: var(--ink); word-break: keep-all; }
.helpful { margin-top: 10px; display: inline-flex; align-items: center; gap: 5px; height: 30px; padding: 0 10px; border-radius: 8px; box-shadow: inset 0 0 0 1px var(--line); font-size: 13px; font-weight: 700; color: var(--ink-2); }
.helpful[aria-pressed="true"] { color: var(--accent-ink); background: var(--accent-soft); box-shadow: none; }
.empty { padding: 20px 0; text-align: center; font-size: 14px; color: var(--ink-3); }
.buy { position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: 8px; padding: 12px 20px 34px; background: var(--surface); border-top: 1px solid var(--line); z-index: 10; }
.buy .cta { margin: 0; }
.buy .cta.ghost { width: 56px; flex: none; font-size: 24px; }
.buy .cta.ghost.on { color: var(--like); }
.opt { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-radius: 14px; background: var(--fill); }
.opt b { font-size: 15.5px; font-weight: 700; display: block; }
.opt span { font-size: 13.5px; color: var(--ink-3); }
.stepper-qty { display: flex; align-items: center; gap: 4px; background: var(--surface); border-radius: 10px; padding: 3px; }
.stepper-qty button { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; font-size: 16px; }
.stepper-qty button:active:not(:disabled) { background: var(--fill); }
.stepper-qty button:disabled { color: var(--ink-4); }
.stepper-qty output { min-width: 24px; text-align: center; font-weight: 800; }
.total { display: flex; justify-content: space-between; align-items: baseline; margin-top: 16px; font-size: 15px; color: var(--ink-2); }
.total b { font-size: 22px; font-weight: 800; color: var(--ink); letter-spacing: -0.02em; }
.done { text-align: center; padding: 18px 0 4px; }
.done > .ic { font-size: 64px; color: var(--accent); }
.done h3 { font-size: 22px; font-weight: 800; margin-top: 10px; letter-spacing: -0.02em; }
.done p { font-size: 14.5px; color: var(--ink-2); margin-top: 6px; }
.p-toast { position: absolute; left: 20px; right: 20px; bottom: 112px; background: rgba(25,31,40,0.94); color: #fff; border-radius: 14px; padding: 13px 16px; font-size: 14.5px; font-weight: 600; display: flex; align-items: center; gap: 8px; z-index: 50; pointer-events: none; }
.p-toast .ic { font-size: 20px; color: #8ec0ff; }

/* ======================================================================
   CONSOLE
   ====================================================================== */
.console { position: relative; width: 1060px; height: 700px; border-radius: 18px; background: var(--surface); box-shadow: var(--shadow-device); overflow: hidden; display: grid; grid-template-columns: 196px 1fr; font-size: 14px; line-height: 1.45; color: var(--ink); }
.c-side { background: #f9fafb; border-right: 1px solid var(--line); padding: 20px 12px; display: flex; flex-direction: column; gap: 2px; }

.c-logo .brand-mark { width: 28px; height: 28px; border-radius: 9px; font-size: 17px; }
.c-logo small { font-size: 11px; font-weight: 700; color: var(--accent-ink); background: var(--accent-soft); padding: 1px 6px; border-radius: 5px; }
.c-nav { width: 100%; display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px; font-size: 14px; font-weight: 500; color: var(--ink-2); transition: background-color 160ms ease; }
.c-nav .ic { font-size: 19px; }
.c-nav.on { background: var(--surface); color: var(--ink); font-weight: 700; box-shadow: 0 1px 3px rgba(25,31,40,0.08); }
@media (hover: hover) and (pointer: fine) { .c-nav:not(.on):hover { background: var(--fill-2); } }
.c-nav .cnt { margin-left: auto; font-size: 12px; font-weight: 700; color: #fff; background: var(--accent); border-radius: 10px; padding: 0 7px; }
.c-main { display: flex; flex-direction: column; min-width: 0; }
.c-top { height: 60px; display: flex; align-items: center; gap: 12px; padding: 0 24px; border-bottom: 1px solid var(--line); }
.c-crumb { flex: 1; font-size: 14px; color: var(--ink-3); }
.c-crumb b { color: var(--ink); font-weight: 700; }
.c-user { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.c-user .ph { width: 30px; height: 30px; border-radius: 50%; }
.c-body { flex: 1; padding: 18px 24px 22px; display: flex; flex-direction: column; gap: 16px; min-height: 0; background: #f9fafb; }
.stepper { display: flex; align-items: center; gap: 8px; }
.stepper .s { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 700; color: var(--ink-4); }
.stepper .s i { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--fill-2); color: var(--ink-3); font-style: normal; font-size: 12px; }
.stepper .s.done { color: var(--ink-2); }
.stepper .s.done i { background: var(--accent-soft); color: var(--accent); }
.stepper .s.cur { color: var(--ink); }
.stepper .s.cur i { background: var(--accent); color: #fff; }
.stepper .bar { flex: 1; height: 2px; background: var(--fill-2); border-radius: 1px; }
.stepper .bar.done { background: var(--accent); }
.c-grid { flex: 1; display: grid; grid-template-columns: 1.75fr 1fr; gap: 16px; min-height: 0; }
.panel { background: var(--surface); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; min-height: 0; box-shadow: 0 1px 2px rgba(25,31,40,0.05); }
.panel-h { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.panel-h h3 { font-size: 17px; font-weight: 800; letter-spacing: -0.02em; flex: 1; }
.panel-h > .ic { font-size: 22px; color: var(--accent); }
.pill { font-size: 12.5px; font-weight: 700; padding: 3px 9px; border-radius: 8px; background: var(--accent-soft); color: var(--accent-ink); display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.pill.gray { background: var(--fill); color: var(--ink-2); }
.pill .ic { font-size: 14px; }
.srcs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 18px; }
.src { background: var(--fill); border-radius: 14px; padding: 14px; transition: background-color 160ms ease, transform 120ms var(--ease-out); }
.src:active { transform: scale(0.98); }
.src[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-ink); }
.src .ic { font-size: 22px; color: var(--ink-2); }
.src[aria-pressed="true"] .ic { color: var(--accent); }
.src b { display: block; font-size: 26px; font-weight: 800; letter-spacing: -0.02em; margin-top: 8px; line-height: 1.1; }
.src span { font-size: 13px; color: var(--ink-3); font-weight: 500; }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { text-align: left; font-size: 12.5px; font-weight: 700; color: var(--ink-3); padding: 0 8px 8px; }
.tbl td { padding: 12px 8px; border-top: 1px solid var(--line); vertical-align: middle; }
.tbl td:first-child { font-weight: 700; }
.tbl td.muted { color: var(--ink-3); }
.filter-big { font-size: 15px; color: var(--ink-2); margin-bottom: 14px; line-height: 1.5; }
.filter-big b { font-size: 30px; font-weight: 800; color: var(--ink); letter-spacing: -0.03em; display: block; line-height: 1.2; }
.xl { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.xl li { display: flex; align-items: center; gap: 10px; padding: 10px 0; font-size: 14px; }
.xl li + li { border-top: 1px solid var(--line); }
.xl li .ic { font-size: 18px; color: var(--ink-4); }
.xl li span { flex: 1; }
.xl li b { font-weight: 700; color: var(--ink-2); }
.c-cta { margin-top: auto; height: 46px; border-radius: 12px; background: var(--accent); color: #fff; font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; }
.c-cta:disabled { background: var(--fill-2); color: var(--ink-3); }
.c-cta.ghost { background: var(--fill); color: var(--ink); }
@media (hover: hover) and (pointer: fine) { .c-cta:not(.ghost):not(:disabled):hover { background: var(--accent-press); } .c-cta.ghost:not(:disabled):hover { background: var(--fill-2); } }
.c-actions { margin-top: auto; display: grid; grid-template-columns: 1fr 1.6fr; gap: 8px; }
.doc { background: var(--fill); border-radius: 14px; padding: 14px 16px; display: flex; gap: 14px; align-items: center; }
.doc + .doc { margin-top: 8px; }
.doc .di { width: 40px; height: 48px; border-radius: 8px; background: var(--surface); display: grid; place-items: center; font-size: 22px; color: var(--gov); box-shadow: 0 1px 3px rgba(25,31,40,0.1); flex: none; }
.doc b { font-size: 14.5px; font-weight: 700; display: block; }
.doc span { font-size: 12.5px; color: var(--ink-3); }
.kv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0; }
.kv div { background: var(--fill); border-radius: 12px; padding: 12px; }
.kv b { display: block; font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
.kv span { font-size: 12.5px; color: var(--ink-3); }
.person { display: flex; align-items: center; gap: 12px; padding-bottom: 14px; border-bottom: 1px solid var(--line); margin-bottom: 6px; }
.person .ph { width: 48px; height: 48px; border-radius: 50%; flex: none; }
.person b { display: block; font-size: 15.5px; font-weight: 800; }
.person span { font-size: 13px; color: var(--ink-3); }
.checks { list-style: none; margin: 0; padding: 0; }
.checks li + li { border-top: 1px solid var(--line); }
.check-row { width: 100%; display: grid; grid-template-columns: 24px 1fr; gap: 10px; padding: 12px 0; align-items: start; }
.check-row > .ic { font-size: 24px; color: var(--accent); }
.check-row > .ic.off { color: var(--ink-4); }
.check-row b { font-size: 15px; font-weight: 700; display: block; line-height: 1.4; }
.check-row span span { font-size: 13.5px; color: var(--ink-2); line-height: 1.5; display: block; margin-top: 2px; }
.check-row q { quotes: "‘" "’"; font-weight: 700; color: var(--ink); }
.done-banner { margin-top: auto; display: flex; align-items: center; gap: 12px; background: var(--gov); color: #fff; border-radius: 14px; padding: 14px 16px; }
.done-banner .ic { font-size: 30px; }
.done-banner b { font-size: 17px; font-weight: 800; display: block; }
.done-banner span { font-size: 13px; opacity: 0.85; }
.preview { display: grid; grid-template-columns: 150px 1fr; gap: 16px; align-items: start; }
.preview .ph { width: 150px; height: 150px; border-radius: 14px; }
.preview .pv-h { font-size: 22px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.25; }
.preview .pv-s { font-size: 14px; color: var(--ink-2); margin-top: 4px; }
.mini-claims { margin-top: 14px; display: flex; flex-direction: column; gap: 6px; }
.mini-claims div { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; font-size: 13.5px; font-weight: 600; }
.mini-claims .ic { font-size: 18px; color: var(--accent); }
.mini-claims .ic.no { color: var(--ink-4); }
.memo { margin-top: 16px; background: var(--fill); border-radius: 12px; padding: 12px 14px; font-size: 13.5px; color: var(--ink-2); line-height: 1.55; }
.memo + .memo { margin-top: 8px; }
.memo b { color: var(--ink); }
.c-toast { position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); background: rgba(25,31,40,0.94); color: #fff; border-radius: 12px; padding: 11px 16px; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; z-index: 30; white-space: nowrap; pointer-events: none; }
.c-toast .ic { font-size: 18px; color: #8ec0ff; }

/* 국가 인증 기관 시스템: 같은 토큰 위에 기관 남색 한 가지를 더한다 */
.console.gov .c-side { background: var(--gov); border-right: 0; color: #fff; }
.console.gov .c-logo { color: #fff; align-items: flex-start; line-height: 1.25; }
.console.gov .c-logo .t2 { display: block; font-size: 11.5px; font-weight: 500; opacity: 0.75; letter-spacing: 0; margin-top: 3px; }
.emblem { width: 32px; height: 32px; border-radius: 50%; background: var(--surface); color: var(--gov); display: grid; place-items: center; font-size: 17px; flex: none; box-shadow: inset 0 0 0 2px var(--gov), inset 0 0 0 4px var(--surface), inset 0 0 0 5px var(--gov); }
.console.gov .c-nav { color: rgba(255,255,255,0.78); }
.console.gov .c-nav.on { background: rgba(255,255,255,0.14); color: #fff; box-shadow: none; }
@media (hover: hover) and (pointer: fine) { .console.gov .c-nav:not(.on):hover { background: rgba(255,255,255,0.08); } }
.console.gov .c-nav .cnt { background: var(--surface); color: var(--gov); }
.console.gov .stepper .s.cur i { background: var(--gov); }
.console.gov .c-cta:not(.ghost):not(:disabled) { background: var(--gov); }
@media (hover: hover) and (pointer: fine) { .console.gov .c-cta:not(.ghost):not(:disabled):hover { background: var(--gov-press); } }
.console.gov .panel-h > .ic, .console.gov .check-row > .ic { color: var(--gov); }
.gov-strip { display: flex; align-items: center; gap: 10px; background: var(--gov-soft); color: var(--gov); border-radius: 12px; padding: 10px 14px; font-size: 13.5px; font-weight: 700; }
.gov-strip .ic { font-size: 18px; }
.gov-strip span { font-weight: 500; color: var(--ink-2); margin-left: auto; }
.cert-layer { position: absolute; inset: 0; background: var(--scrim); display: grid; place-items: center; z-index: 25; }
.cert { position: relative; width: 540px; background: var(--surface); border-radius: 16px; padding: 30px 36px 28px; box-shadow: 0 30px 60px -20px rgba(0,0,0,0.4); }
.cert::before { content: ""; position: absolute; inset: 10px; border: 1.5px solid var(--gov); border-radius: 10px; pointer-events: none; }
.cert .icon-btn { position: absolute; right: 18px; top: 18px; color: var(--ink-3); font-size: 22px; z-index: 1; }
.cert .c-no { font-size: 12.5px; color: var(--ink-3); }
.cert h3 { font-size: 26px; font-weight: 800; letter-spacing: 0.2em; text-align: center; color: var(--gov); margin: 10px 0 18px; }
.cert dl { display: grid; grid-template-columns: 90px 1fr; gap: 8px 12px; margin: 0; font-size: 14px; }
.cert dt { color: var(--ink-3); font-weight: 600; }
.cert dd { margin: 0; font-weight: 600; }
.cert .c-body2 { margin-top: 16px; font-size: 13.5px; line-height: 1.6; color: var(--ink-2); }
.cert .c-sign { display: flex; align-items: center; justify-content: flex-end; gap: 12px; margin-top: 18px; font-size: 17px; font-weight: 800; color: var(--gov); }
.cert .seal { width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; font-size: 30px; color: var(--like); box-shadow: inset 0 0 0 2.5px var(--like), inset 0 0 0 5px var(--surface), inset 0 0 0 6.5px var(--like); transform: rotate(-8deg); }

/* ---------- Motion (authored moments) ---------- */
@media (prefers-reduced-motion: no-preference) {
  .play .sheet, .sheet.enter { animation: sheet-in 420ms var(--ease-drawer) both; }
  .play .dim, .dim.enter { animation: fade-in 300ms ease both; }
  .play .ring { animation: ring 1.4s var(--ease-out) 300ms 2 both; }
  .play .tap { animation: tap 900ms var(--ease-out) 200ms both; }
  .play .pop { animation: pop 320ms var(--ease-out) both; animation-delay: calc(var(--i, 0) * 70ms + 650ms); }
  .play .stamp { animation: stamp 360ms var(--ease-out) 380ms both; }
  .play .flag-q { animation: pop 320ms var(--ease-out) 350ms both; }
  .p-toast, .c-toast { animation: toast-in 260ms var(--ease-out) both; }
  .cert-layer.enter { animation: fade-in 200ms ease both; }
  .cert-layer.enter .cert { animation: pop 260ms var(--ease-out) both; }
  .done > .ic { animation: pop 320ms var(--ease-out) both; }
}
@media (prefers-reduced-motion: reduce) {
  .swap, .swap.out { transform: none; filter: none; }
}
@keyframes sheet-in { from { transform: translateY(100%); } to { transform: translateY(0); } }
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes ring { 0% { opacity: 0.9; transform: scale(1); } 100% { opacity: 0; transform: scale(1.18); } }
@keyframes tap { 0% { opacity: 0; transform: scale(1.4); } 40% { opacity: 1; transform: scale(0.92); } 100% { opacity: 1; transform: scale(1); } }
@keyframes pop { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
@keyframes stamp { 0% { opacity: 0; transform: scale(1.08); } 100% { opacity: 1; transform: scale(1); } }
@keyframes toast-in { from { opacity: 0; translate: 0 10px; } to { opacity: 1; translate: 0 0; } }

/* ---------- Narrow screens ---------- */
@media (max-width: 1100px) {
  body { overflow: auto; height: auto; }
  html { height: auto; }
  .shell { display: flex; flex-direction: column; height: auto; }
  .rail { padding: 16px 12px 12px; border-radius: 20px; }
  .brand { padding: 0 6px 12px; }
  .rail-list { flex-direction: row; overflow-x: auto; overflow-y: hidden; gap: 14px; padding-bottom: 4px; }
  .rail-group { flex: none; }
  .rail-group ol { flex-direction: row; }
  .rail-item { white-space: nowrap; padding: 6px 10px 6px 6px; font-size: 14px; }
  .rail-foot, .rail-group h2 { display: none; }
  .main, .main.is-console { grid-template-columns: minmax(0, 1fr); gap: 20px; padding: 20px 4px; }
  .copy-body { gap: 14px; padding-bottom: 16px; }
  .step-no { font-size: 52px; }
  .step-title { font-size: 28px; }
  .step-desc { font-size: 17px; }
  .bubble { font-size: 18px; }
  .nav { order: 3; }
  .kbd { display: none; }
  .stage { order: 2; }
}

<script>
(() => {
  const ic = (n, c = '') => `<svg class="ic ${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
  const num = (n) => new Intl.NumberFormat('ko-KR').format(n);
  const won = (n) => num(n) + '원';
  const PRICE = 32000;
  const GOV = '국가광고검증원';

  /* ---------- images ---------- */
  const LOADED = new Set();
  const IMG = {
    'product': ['product.jpg', '1024×1024', '온도랩 수분 앰플 제품 사진'],
    'feed-post': ['feed-post.png', '1024×1024', '피드의 일반 게시물 사진'],
    'consumer': ['consumer.png', '1024×1024', '소비자 프로필 사진'],
    'reviewer': ['reviewer.png', '1024×1024', '국가 인증 기관 연구원 프로필 사진'],
    'marketer': ['marketer.png', '1024×1024', '마케팅 담당자 프로필 사진'],
  };
  const img = (key, cls = '') => {
    const [file, size, alt] = IMG[key];
    return `<span class="ph ${cls}" role="img" aria-label="${alt}"><span class="ph-label">${ic('image')}<b>${file}</b><small>${size}</small></span><img src="img/${file}" alt=""${LOADED.has(file) ? ' class="loaded"' : ''}></span>`;
  };
  const mono = (t, color) => `<span class="avatar mono" style="background:var(--brand-${color})">${t}</span>`;
  const btn = (attrs, inner, cls = 'icon-btn') => `<button type="button" class="${cls}" ${attrs}>${inner}</button>`;

  /* ---------- demo state ---------- */
  const state = {
    liked: false, likes: 2481, saved: false,
    checks: [true, true, true], approving: false, sentBack: false,
    cert: false, publishing: false,
    tab: 'src', rankCat: 'ampoule',
    reviewFilter: 'all', helpful: {},

  // 단계를 옮길 때마다 진행 중인 상태는 처음으로 돌린다. 캡처할 때 매번 같은 화면이 나오게 하기 위해서다.
  function resetTransient() {
    Object.assign(state, { approving: false, sentBack: false, cert: false, publishing: false, order: null, orderFresh: false, qty: 1, paying: false, checks: [true, true, true], tab: 'src' });
  }

  /* ---------- phone parts ---------- */
  const statusbar = () => `

      <span class="sb-r"><span class="sb-bars"><i style="height:4px"></i><i style="height:6px"></i><i style="height:9px"></i><i style="height:12px"></i></span><span class="sb-batt"><i></i></span></span>

  const ONLY_FEED = 'data-toast="시연에서는 홈 피드와 쇼핑만 열려요"';

    ${btn('data-go="1" aria-label="홈"', ic('house'), 'icon-btn on')}

    ${btn('data-go="13" aria-label="쇼핑"', ic('storefront'))}

  const adPost = (o = {}) => {
    let trust;
    if (o.trust === 'score') {
      trust = `<button type="button" class="score-chip pop press" style="--i:0" data-go="10">${ic('shield-check-f')}신뢰도 <b data-count="91">91</b></button>
        <button type="button" class="badge pop press" style="--i:1" data-go="10">${ic('check-circle-f')}검증 완료</button>
        <button type="button" class="badge pop press" style="--i:2" data-go="10">${ic('user-check')}담당자 검수</button>`;
    } else if (o.trust === 'badges') {
      trust = `<button type="button" class="score-chip press" data-go="10">${ic('shield-check-f')}신뢰도 <b>91</b></button>
        <button type="button" class="badge press" data-go="10">${ic('check-circle-f')}근거 확인</button>

    } else {

      const tick = (t) => {
        const p = Math.min(1, Math.max(0, (t - t0) / dur));
        el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3)));
        if (p < 1) requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    });
  }

  // 새 단계로 들어올 때: 등장 모션을 재생하고 스크롤을 단계별 시작 위치로 맞춘다.
  function paint(n) {
    copyEl.innerHTML = copyHTML(n);
    deviceEl.innerHTML = S[n]();
    deviceEl.classList.remove('play'); void deviceEl.offsetWidth; deviceEl.classList.add('play');
    deviceEl.querySelectorAll('[data-start]').forEach((el) => { el.scrollTop = +el.dataset.start; });
    mainEl.classList.toggle('is-console', isConsole(n));
    fit();
    countUp(deviceEl);
  }

  // 같은 단계 안에서 상태가 바뀔 때: 등장 모션 없이 다시 그리고, 스크롤 위치와 펼친 항목을 그대로 둔다.
  function refresh() {
    const scrolls = {}, open = [];
    deviceEl.querySelectorAll('[data-scroll]').forEach((el) => { scrolls[el.dataset.scroll] = el.scrollTop; });
    deviceEl.querySelectorAll('.acc').forEach((el, i) => { if (el.classList.contains('open')) open.push(i); });
    deviceEl.classList.remove('play');
    deviceEl.innerHTML = S[current]();
    deviceEl.querySelectorAll('[data-scroll]').forEach((el) => { el.scrollTop = scrolls[el.dataset.scroll] ?? +(el.dataset.start || 0); });
    const accs = deviceEl.querySelectorAll('.acc');
    open.forEach((i) => accs[i] && setAcc(accs[i], true));
    state.orderFresh = false;
    state.certFresh = false;
  }

  function go(n, { push = true } = {}) {
    n = Math.max(1, Math.min(TOTAL, n));
    if (n === current) return;
    const first = current === 0;
    current = n;
    resetTransient();
    rail.querySelectorAll('.rail-item').forEach((b) => {
      const k = +b.dataset.step;
      if (k === n) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current');
      b.classList.toggle('done', k < n);
    });
    const active = rail.querySelector('[aria-current="step"]');
    if (active && rail.scrollWidth > rail.clientWidth) active.scrollIntoView({ block: 'nearest', inline: 'center' });
    document.getElementById('prev').disabled = n === 1;
    document.getElementById('next').disabled = n === TOTAL;
    if (push) {
      const h = `#${clean ? 'clean' : 'step'}-${n}`;
      if (location.hash !== h) history.replaceState(null, '', h);
    }
    if (first || reduce.matches) { paint(n); return; }
    copyEl.classList.add('out'); deviceEl.classList.add('out');
    setTimeout(() => { paint(n); copyEl.classList.remove('out'); deviceEl.classList.remove('out'); }, 120);
  }

  function setClean(on) {
    clean = on;
    document.body.classList.toggle('clean', on);
    history.replaceState(null, '', `#${on ? 'clean' : 'step'}-${current}`);
    requestAnimationFrame(fit);
  }

  function fromHash() {
    const m = /^#(step|clean)-(\d{1,2})$/.exec(location.hash);
    if (!m) return go(current || 1, { push: false });
    const on = m[1] === 'clean';
    if (on !== clean) { clean = on; document.body.classList.toggle('clean', on); }
    go(+m[2], { push: false });
    requestAnimationFrame(fit);
  }

  /* ---------- in-device feedback ---------- */
  let toastTimer;
  function toast(msg) {
    const host = deviceEl.querySelector('.screen, .console');
    if (!host) return;
    host.querySelector('.p-toast, .c-toast')?.remove();
    const el = document.createElement('div');
    el.className = host.classList.contains('console') ? 'c-toast' : 'p-toast';
    el.setAttribute('role', 'status');
    el.innerHTML = ic('check-circle-f') + '<span></span>';
    el.querySelector('span').textContent = msg;
    host.appendChild(el);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.remove(), 1800);
  }
  function setAcc(acc, open) {
    acc.classList.toggle('open', open);
    acc.querySelector('[data-acc]')?.setAttribute('aria-expanded', open);
  }
  const later = (step, ms, fn) => setTimeout(() => { if (current === step) fn(); }, ms);

  const ACTIONS = {
    like() { state.liked = !state.liked; refresh(); },
    save() { state.saved = !state.saved; refresh(); toast(state.saved ? '저장했어요' : '저장을 취소했어요'); },
    src(el) {
      const on = el.getAttribute('aria-pressed') !== 'true';
      deviceEl.querySelectorAll('.src').forEach((b) => b.setAttribute('aria-pressed', 'false'));
      el.setAttribute('aria-pressed', on);
      if (on) toast(`${el.dataset.v} 자료 ${el.querySelector('b').textContent}건을 확인했어요`);
    },
    check(el) { const i = +el.dataset.i; state.checks[i] = !state.checks[i]; refresh(); },
    sendback() { state.sentBack = true; refresh(); toast('AI 분석 담당에게 수정을 요청했어요'); },
    approve() { state.approving = true; refresh(); later(7, 700, () => go(8)); },
    'cert-open'() { state.cert = true; state.certFresh = true; refresh(); },
    'cert-close'() { state.cert = false; refresh(); },
    publish() { state.publishing = true; refresh(); later(8, 700, () => go(9)); },
    tab(el) { state.tab = el.dataset.v; refresh(); },
    rank(el) { state.rankCat = el.dataset.v; refresh(); },
    rfilter(el) { state.reviewFilter = el.dataset.v; refresh(); },
    helpful(el) { state.helpful[el.dataset.id] = !state.helpful[el.dataset.id]; refresh(); },
    wish() { state.wish = !state.wish; refresh(); toast(state.wish ? '찜 목록에 담았어요' : '찜을 해제했어요'); },
    buy() { state.order = 'sheet'; state.orderFresh = true; refresh(); },
    qty(el) { state.qty = Math.max(1, Math.min(9, state.qty + +el.dataset.d)); refresh(); },
    pay() {
      state.paying = true; refresh();
      later(13, 900, () => { if (state.order) { state.paying = false; state.order = 'done'; refresh(); } });
    },
    'order-close'() { state.order = null; refresh(); },
  };

  /* ---------- events ---------- */
  rail.addEventListener('click', (e) => { const b = e.target.closest('[data-step]'); if (b) go(+b.dataset.step); });
  document.getElementById('prev').addEventListener('click', () => go(current - 1));
  document.getElementById('next').addEventListener('click', () => go(current + 1));
  document.getElementById('clean').addEventListener('click', () => setClean(true));
  document.getElementById('cleanExit').addEventListener('click', () => setClean(false));
  document.addEventListener('keydown', (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey || e.target.closest('input, textarea')) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); go(current + 1); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(current - 1); }
    else if (e.key === 'Home') go(1);
    else if (e.key === 'End') go(TOTAL);
    else if (e.key === 'c' || e.key === 'C') setClean(!clean);
    else if (e.key === 'Escape') {
      if (state.cert) ACTIONS['cert-close']();
      else if (state.order === 'sheet' && !state.paying) ACTIONS['order-close']();
      else if (clean) setClean(false);
    }
  });
  deviceEl.addEventListener('click', (e) => {
    const t = e.target.closest('[data-act], [data-go], [data-toast], [data-acc]');
    if (!t || t.disabled) return;
    // 인증서 카드 안쪽을 누르면 바깥 배경(닫기)으로 번지지 않게 한다.
    const stopper = e.target.closest('[data-stop]');
    if (stopper && !stopper.contains(t)) return;
    if (t.hasAttribute('data-acc')) { const acc = t.closest('.acc'); setAcc(acc, !acc.classList.contains('open')); return; }
    if (t.dataset.act && ACTIONS[t.dataset.act]) ACTIONS[t.dataset.act](t);
    if (t.dataset.go) go(+t.dataset.go);
    if (t.dataset.toast) toast(t.dataset.toast);
  });
  document.addEventListener('load', (e) => {
    if (e.target.tagName === 'IMG' && e.target.closest('.ph')) { e.target.classList.add('loaded'); LOADED.add(e.target.getAttribute('src').slice(4)); }
  }, true);
  window.addEventListener('hashchange', fromHash);
  new ResizeObserver(fit).observe(stageEl);
  fromHash();
})();
</script>
